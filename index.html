<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https:;
  connect-src 'self' https://api.anthropic.com https://*.supabase.co;
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
"/>
<meta http-equiv="X-Content-Type-Options" content="nosniff"/>
<meta http-equiv="X-Frame-Options" content="DENY"/>
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin"/>
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(self), geolocation=()"/>
<meta name="theme-color" content="#B91C1C"/>
<meta name="description" content="Languway French — Apprenez le français du niveau Pré-A1 jusqu'au C2"/>
<link rel="manifest" href="manifest.json"/>
<title>Languway French</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ================================================================
   LANGUWAY FRENCH v3 — Classic & Complete
   ================================================================ */
:root{
  --cr:#B91C1C;--cr2:#991B1B;--cr-lt:#FEF2F2;--cr-md:#FCA5A5;
  --gold:#92400E;--gold-lt:#FFFBEB;
  --bg:#FAFAF8;--bg2:#F5F5F0;--surf:#FFFFFF;
  --bdr:#E8E8E0;--txt:#1C1917;--txt2:#57534E;--txt3:#A8A29E;
  --sh:0 1px 8px rgba(0,0,0,.07);--sh2:0 4px 20px rgba(0,0,0,.1);
  --r:12px;--rs:8px;--rl:20px;--tr:.2s ease;
  --ff:'Inter',sans-serif;--ffs:'Cormorant Garamond',serif;
}
.dark{--bg:#0C0A09;--bg2:#1C1917;--surf:#231F1E;--bdr:#3C3835;
  --txt:#FAF9F7;--txt2:#A8A29E;--txt3:#57534E;
  --sh:0 1px 8px rgba(0,0,0,.4);--sh2:0 4px 20px rgba(0,0,0,.5);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
img,svg{max-width:100%}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none}

/* ── SPLASH ──────────────────────────────────────────────────── */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0C0A09;text-align:center;padding:24px;transition:opacity .6s}
.spl-emblem{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,#B91C1C,#7F1D1D);
  display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
  box-shadow:0 0 40px rgba(185,28,28,.5);animation:spl-in .7s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes spl-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.spl-flag{font-size:2.6rem}
.spl-brand{font-family:var(--ffs);font-size:3rem;font-weight:700;color:#fff;letter-spacing:3px;animation:spl-up .6s ease .4s both}
.spl-sub{font-size:.72rem;letter-spacing:8px;color:#B91C1C;text-transform:uppercase;margin-top:4px;animation:spl-up .6s ease .5s both}
.spl-line{width:1px;height:40px;background:linear-gradient(to bottom,transparent,#B91C1C,transparent);margin:20px auto;animation:spl-up .6s ease .6s both}
.spl-tagline{color:#78716C;font-size:.9rem;letter-spacing:2px;animation:spl-up .6s ease .7s both}
.spl-bar{width:160px;height:2px;background:#1C1917;border-radius:1px;margin:28px auto 0;overflow:hidden;animation:spl-up .3s ease .8s both}
.spl-bar-fill{height:100%;background:#B91C1C;animation:spl-load 2.4s ease forwards}
@keyframes spl-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spl-load{from{width:0}to{width:100%}}
.spl-skip{position:absolute;bottom:28px;right:24px;color:#57534E;font-size:.78rem;cursor:pointer;letter-spacing:1px;padding:8px}
.spl-skip:hover{color:#fff}

/* ── LAYOUT ──────────────────────────────────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column}

/* ── TOPBAR ──────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:100;height:58px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--surf);border-bottom:1px solid var(--bdr);box-shadow:var(--sh)}
.topbar-menu{width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:7px;border-radius:var(--rs)}
.topbar-menu:hover{background:var(--bg2)}
.topbar-menu span{display:block;height:1.5px;background:var(--txt);border-radius:1px;transition:all var(--tr)}
.topbar-brand{flex:1;cursor:pointer;display:flex;align-items:center;gap:10px}
.topbar-logo-mark{width:30px;height:30px;border-radius:8px;background:var(--cr);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-wordmark{font-family:var(--ffs);font-size:1.2rem;font-weight:600;letter-spacing:.5px}
.topbar-wordmark span{color:var(--cr)}
.lvl-chip{background:var(--cr);color:#fff;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.5px}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sidebar{position:fixed;left:-300px;top:0;bottom:0;width:300px;background:var(--surf);
  z-index:200;transition:left .28s ease;box-shadow:var(--sh2);overflow-y:auto;display:flex;flex-direction:column}
.sidebar.open{left:0}
.sb-header{padding:20px 16px;border-bottom:1px solid var(--bdr);background:linear-gradient(135deg,#0C0A09,#1C1917)}
.sb-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sb-logo-mark{width:36px;height:36px;border-radius:10px;background:var(--cr);display:flex;align-items:center;justify-content:center}
.sb-brand-txt{font-family:var(--ffs);font-size:1.3rem;font-weight:600;color:#fff;letter-spacing:.5px}
.sb-brand-txt span{color:var(--cr-md)}
.sb-tagline{font-size:.72rem;color:#57534E;letter-spacing:2px;margin-left:46px}
.sb-nav{flex:1;padding:12px 0}
.sb-item{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;transition:all var(--tr);font-size:.9rem;font-weight:500;color:var(--txt2)}
.sb-item:hover,.sb-item.active{background:var(--cr-lt);color:var(--cr)}
.sb-item .si{font-size:1.1rem;width:22px;text-align:center}
.sb-sep{height:1px;background:var(--bdr);margin:8px 16px}
.sb-footer{padding:16px;border-top:1px solid var(--bdr);font-size:.75rem;color:var(--txt3);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;opacity:0;pointer-events:none;transition:opacity .28s}
.overlay.show{opacity:1;pointer-events:all}

/* ── MAIN ────────────────────────────────────────────────────── */
.main{flex:1;padding:16px 16px 72px;max-width:700px;margin:0 auto;width:100%}
.page{display:none}.page.active{display:block}

/* ── BOTTOM NAV ──────────────────────────────────────────────── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:62px;
  background:var(--surf);border-top:1px solid var(--bdr);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:.58rem;font-weight:600;letter-spacing:.3px;color:var(--txt3);
  transition:color var(--tr);min-height:48px;padding:4px 2px;cursor:pointer}
.bnav-btn .bi{font-size:1.2rem;line-height:1}
.bnav-btn.active{color:var(--cr)}

/* ── CARDS ───────────────────────────────────────────────────── */
.card{background:var(--surf);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bdr)}
.card-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--cr);margin-bottom:10px}
.card-title{font-family:var(--ffs);font-size:1.2rem;font-weight:600;margin-bottom:4px}

/* ── BUTTONS ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border-radius:var(--rs);
  font-weight:600;font-size:.88rem;transition:all var(--tr);cursor:pointer;border:none;min-height:44px;letter-spacing:.2px}
.btn-p{background:var(--cr);color:#fff}
.btn-p:hover{background:var(--cr2);transform:translateY(-1px)}
.btn-p:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-o{background:transparent;color:var(--cr);border:1.5px solid var(--cr)}
.btn-o:hover{background:var(--cr-lt)}
.btn-g{background:transparent;color:var(--txt2)}
.btn-g:hover{background:var(--bg2)}
.btn-sm{padding:7px 14px;font-size:.8rem;min-height:36px}
.btn-ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);transition:background var(--tr)}
.btn-ic:hover{background:var(--bdr)}
.btn-tts{background:var(--cr-lt);color:var(--cr);border:none;border-radius:20px;padding:4px 11px;font-size:.75rem;cursor:pointer;transition:all var(--tr)}
.btn-tts:hover{background:var(--cr);color:#fff}
.btn-slow{background:#EFF6FF;color:#1D4ED8;border:none;border-radius:20px;padding:4px 11px;font-size:.74rem;cursor:pointer;margin-left:5px;transition:all var(--tr)}
.btn-slow:hover{background:#1D4ED8;color:#fff}

/* ── TOGGLE ──────────────────────────────────────────────────── */
.tog{position:relative;display:inline-block;width:46px;height:24px}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:#D6D3D1;border-radius:24px;cursor:pointer;transition:.25s}
.tog-sl:before{content:'';position:absolute;width:18px;height:18px;bottom:3px;left:3px;background:#fff;border-radius:50%;transition:.25s}
input:checked+.tog-sl{background:var(--cr)}
input:checked+.tog-sl:before{transform:translateX(22px)}

/* ── HOME ────────────────────────────────────────────────────── */
.hero{padding:28px 0 20px;text-align:center;position:relative}
.hero-ornament{font-size:.7rem;letter-spacing:4px;color:var(--cr);text-transform:uppercase;margin-bottom:14px}
.hero-title{font-family:var(--ffs);font-size:2.4rem;font-weight:700;color:var(--txt);line-height:1.2;margin-bottom:8px}
.hero-sub{color:var(--txt2);font-size:.88rem;line-height:1.6;max-width:340px;margin:0 auto}
.hero-divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.hero-divider::before,.hero-divider::after{content:'';flex:1;height:1px;background:var(--bdr)}
.hero-divider span{font-size:.7rem;letter-spacing:2px;color:var(--txt3)}

/* Stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--surf);border-radius:var(--rs);padding:12px 8px;text-align:center;border:1px solid var(--bdr)}
.stat-v{font-size:1.3rem;font-weight:700;color:var(--cr)}
.stat-l{font-size:.62rem;color:var(--txt3);margin-top:2px}

/* XP Tier */
.tier-row{display:flex;align-items:center;gap:12px}
.tier-ic{font-size:1.8rem}
.tier-info{flex:1}
.tier-nm{font-size:.82rem;font-weight:600;display:block;margin-bottom:5px}
.tier-bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.tier-fill{height:100%;background:linear-gradient(90deg,var(--cr),#F87171);border-radius:3px;transition:width .6s}
.tier-xp{font-size:.82rem;font-weight:700;color:var(--cr)}

/* Placement */
.placement-card{text-align:center;background:linear-gradient(135deg,var(--cr-lt),var(--surf));border:1px solid var(--cr-md)}
.pl-ornament{font-size:.65rem;letter-spacing:3px;color:var(--cr);text-transform:uppercase;margin-bottom:10px}

/* Daily challenge */
.chal-card{border-left:3px solid #F59E0B}
.chal-row{display:flex;align-items:center;gap:12px}
.chal-ic{font-size:1.6rem}
.chal-xp-pill{margin-left:auto;background:#FFFBEB;color:#92400E;padding:3px 10px;border-radius:12px;font-size:.74rem;font-weight:700;white-space:nowrap}

/* Quick grid */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick-btn-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:14px;
  cursor:pointer;text-align:left;transition:all var(--tr);display:flex;flex-direction:column;gap:4px}
.quick-btn-card:hover{border-color:var(--cr);background:var(--cr-lt)}
.quick-btn-card .qb-ic{font-size:1.4rem;margin-bottom:2px}
.quick-btn-card .qb-nm{font-size:.82rem;font-weight:600}
.quick-btn-card .qb-ds{font-size:.7rem;color:var(--txt3)}

/* Roadmap */
.roadmap-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rm-label{width:48px;font-size:.72rem;font-weight:700;text-align:right;flex-shrink:0}
.rm-track{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}
.rm-pct{font-size:.68rem;color:var(--txt3);width:28px;text-align:right;flex-shrink:0}

/* Next lesson card */
.nl-card{border-left:3px solid #1D4ED8}
.nl-row{display:flex;align-items:center;gap:12px}
.nl-ic{font-size:1.5rem}
.nl-band{font-size:.68rem;font-weight:700;padding:2px 10px;border-radius:12px;display:inline-block;margin-top:4px}

/* ── PATH ────────────────────────────────────────────────────── */
.band-tabs{display:flex;gap:0;border-bottom:2px solid var(--bdr);margin-bottom:18px;overflow-x:auto}
.band-tab{padding:10px 14px;font-size:.8rem;font-weight:700;border-bottom:3px solid transparent;
  margin-bottom:-2px;white-space:nowrap;color:var(--txt3);cursor:pointer;letter-spacing:.5px;transition:all var(--tr)}
.band-tab.active{color:var(--cr);border-bottom-color:var(--cr)}
.band-info-card{border-radius:var(--rs);padding:14px;margin-bottom:14px}
.level-node{background:var(--surf);border-radius:var(--r);border:1.5px solid var(--bdr);overflow:hidden;
  margin-bottom:10px;box-shadow:var(--sh);transition:all var(--tr)}
.level-node.unlocked{cursor:pointer}
.level-node.unlocked:hover{border-color:var(--cr);transform:translateY(-1px);box-shadow:var(--sh2)}
.level-node.locked{opacity:.4;filter:grayscale(.7)}
.level-node.done{border-color:#15803D22}
.lnode-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lnode-ic{font-size:1.4rem;width:32px;text-align:center}
.lnode-info{flex:1}
.lnode-info h4{font-size:.88rem;font-weight:600;margin-bottom:2px}
.lnode-info small{font-size:.74rem;color:var(--txt3)}
.lnode-code{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:12px;color:#fff}
.lnode-status{font-size:1rem;margin-left:6px}
.lnode-pbar{height:3px;background:var(--bg2);margin:0 16px 10px}

/* ── WORDBOOK ────────────────────────────────────────────────── */
.wb-search{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);
  background:var(--surf);color:var(--txt);font-size:.9rem;margin-bottom:10px}
.wb-search:focus{outline:none;border-color:var(--cr)}
.wb-filters{display:flex;gap:8px;margin-bottom:14px}
.wb-filters select{flex:1;padding:9px 10px;border:1px solid var(--bdr);border-radius:var(--rs);
  background:var(--surf);color:var(--txt);font-size:.82rem}
.wc{background:var(--surf);border-radius:var(--rs);padding:14px;margin-bottom:9px;border:1px solid var(--bdr)}
.wc-fr{font-family:var(--ffs);font-size:1.1rem;font-weight:600;color:var(--cr);margin-bottom:2px}
.wc-pron{font-size:.72rem;color:var(--txt3);margin-bottom:4px}
.wc-mn{font-size:.86rem;font-weight:500;margin-bottom:4px}
.wc-ex{font-size:.78rem;color:var(--txt2);font-style:italic;margin-bottom:7px}
.wc-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wc-band{padding:2px 9px;border-radius:12px;font-size:.68rem;font-weight:700}
.wc-state{font-size:.68rem;padding:2px 9px;border-radius:12px;font-weight:500}
.cog-pill{display:inline-flex;align-items:center;gap:4px;background:#FFFBEB;color:#92400E;
  border:1px solid #FCD34D;border-radius:12px;padding:2px 9px;font-size:.7rem;font-weight:600;margin-top:3px}

/* ── TRAINING ────────────────────────────────────────────────── */
.tr-list{display:flex;flex-direction:column;gap:9px}
.tr-card{background:var(--surf);border-radius:var(--rs);padding:15px 16px;display:flex;align-items:center;
  gap:14px;cursor:pointer;border:1.5px solid var(--bdr);box-shadow:var(--sh);transition:all var(--tr)}
.tr-card:hover{border-color:var(--cr);transform:translateX(4px)}
.tr-ic{font-size:1.4rem;width:32px;text-align:center}
.tr-info{flex:1}
.tr-info h4{font-size:.88rem;font-weight:600;margin-bottom:2px}
.tr-info small{color:var(--txt3);font-size:.74rem}

/* ── SITUATIONS ──────────────────────────────────────────────── */
.sit-grid{display:flex;flex-direction:column;gap:9px}
.sit-card{background:var(--surf);border-radius:var(--rs);padding:15px 16px;display:flex;align-items:center;
  gap:14px;cursor:pointer;border:1.5px solid var(--bdr);box-shadow:var(--sh);transition:all var(--tr)}
.sit-card:hover{border-color:var(--cr);transform:translateX(4px)}
.sit-ic{font-size:1.6rem;width:36px;text-align:center}
.sit-info{flex:1}
.sit-info h4{font-size:.88rem;font-weight:600;margin-bottom:3px}
.sit-info small{font-size:.74rem;color:var(--txt2)}
.phrase-blk{background:var(--bg2);border-radius:var(--rs);padding:14px;margin-bottom:9px;border:1px solid var(--bdr)}
.phrase-fr{font-family:var(--ffs);font-size:1rem;font-weight:600;color:var(--cr);margin-bottom:3px}
.phrase-tr{font-size:.84rem;margin-bottom:3px}
.phrase-note{font-size:.72rem;background:var(--surf);padding:2px 10px;border-radius:12px;color:var(--txt2);display:inline-block;margin-bottom:7px}
.phrase-acts{display:flex;gap:7px}

/* ── PROGRESS ────────────────────────────────────────────────── */
.prog-overview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.prog-num{font-size:2rem;font-weight:700;color:var(--cr);line-height:1}
.pbar-track{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s}
.prog-band-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.prog-band-lbl{width:44px;font-size:.7rem;font-weight:700;text-align:right;flex-shrink:0}
.stats-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-it{background:var(--bg2);padding:11px 13px;border-radius:var(--rs);display:flex;justify-content:space-between;align-items:center}
.stat-it span{color:var(--txt2);font-size:.82rem}
.stat-it strong{color:var(--cr);font-size:.9rem}
.ach-list{display:flex;flex-direction:column;gap:7px}
.ach-card{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--bg2);border-radius:var(--rs);border:1px solid var(--bdr)}
.ach-card.earned{background:#FFFBEB;border-color:#FCD34D}
.ach-card.locked{opacity:.45}
.ach-ic{font-size:1.3rem;width:28px;text-align:center}
.ach-info strong{display:block;font-size:.82rem;margin-bottom:2px}
.ach-info small{font-size:.72rem;color:var(--txt2)}
.cal-row{display:flex;gap:5px;justify-content:space-between}
.cal-d{flex:1;text-align:center;font-size:.68rem;color:var(--txt2)}
.cal-dot{width:24px;height:24px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--bdr);margin:4px auto 0}
.cal-dot.on{background:var(--cr);border-color:var(--cr)}

/* ── SETTINGS ────────────────────────────────────────────────── */
.set-tabs{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:16px;overflow-x:auto;gap:0}
.set-tab{padding:9px 14px;font-size:.8rem;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;
  white-space:nowrap;color:var(--txt3);cursor:pointer;letter-spacing:.3px;transition:all var(--tr)}
.set-tab.active{color:var(--cr);border-bottom-color:var(--cr)}
.set-panel.hidden{display:none}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--bg2);gap:14px}
.set-row:last-child{border-bottom:none}
.set-row label:first-child{font-size:.88rem;font-weight:500}
.set-row select{padding:7px 10px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--surf);color:var(--txt);font-size:.82rem}
.set-acts{display:flex;flex-direction:column;gap:9px}
.set-acts .btn{width:100%;justify-content:flex-start}
.ulang-pill{background:var(--cr-lt);color:var(--cr);padding:5px 13px;border-radius:20px;font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:6px}

/* ── ABOUT ───────────────────────────────────────────────────── */
.about-hero{text-align:center;padding:24px 0 18px}
.about-emblem{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,var(--cr),var(--cr2));
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.how-step{display:flex;gap:14px;margin-bottom:14px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--cr);color:#fff;font-weight:700;font-size:.76rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.how-step-body p{font-size:.82rem;color:var(--txt2);margin-top:3px;line-height:1.6}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat-box{background:var(--bg2);border-radius:var(--rs);padding:12px}
.feat-ic{font-size:1.2rem;margin-bottom:5px}
.feat-box strong{display:block;font-size:.82rem;margin-bottom:3px}
.feat-box small{font-size:.72rem;color:var(--txt2);line-height:1.5}

/* ── SHARE PAGE ──────────────────────────────────────────────── */
.share-hero{text-align:center;padding:20px 0 14px}
.qr-wrap{background:var(--surf);border-radius:var(--r);padding:24px;text-align:center;margin-bottom:14px;border:1px solid var(--bdr)}
.qr-svg{margin:0 auto 14px;display:block}
.share-btn-row{display:flex;flex-direction:column;gap:9px}
.share-btn{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--bg2);border:1.5px solid var(--bdr);
  border-radius:var(--rs);cursor:pointer;width:100%;text-align:left;font-size:.88rem;font-weight:500;transition:all var(--tr)}
.share-btn:hover{border-color:var(--cr);background:var(--cr-lt);color:var(--cr)}
.share-btn .sb-ic{font-size:1.4rem;width:28px}
.install-steps{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.inst-step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--bg2);border-radius:var(--rs)}
.inst-num{width:24px;height:24px;border-radius:50%;background:var(--cr);color:#fff;font-weight:700;font-size:.74rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.inst-step p{font-size:.82rem;color:var(--txt2);margin-top:2px;line-height:1.5}
.inst-step strong{font-size:.86rem}
.install-banner{background:linear-gradient(135deg,var(--cr-lt),var(--surf));border:1px solid var(--cr-md);border-radius:var(--r);padding:16px;text-align:center;margin-bottom:14px}
.install-banner h3{margin-bottom:8px}
#install-btn{display:none}

/* ── MODALS ──────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:none;align-items:flex-end;overflow:hidden}
.modal.open{display:flex}
.modal-box{background:var(--surf);border-radius:var(--rl) var(--rl) 0 0;width:100%;max-height:93vh;overflow-y:auto;animation:slideUp .28s ease}
.modal-box.full{border-radius:0;max-height:100vh;height:100vh}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@media(min-width:680px){
  .modal{align-items:center}
  .modal-box,.modal-box.full{border-radius:var(--rl);max-height:88vh;height:auto;max-width:600px;margin:0 auto}
}

/* ── LESSON ──────────────────────────────────────────────────── */
.lesson-hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:11px;
  padding:13px 16px;border-bottom:1px solid var(--bdr);background:var(--surf)}
.lp-wrap{flex:1;display:flex;align-items:center;gap:9px;font-size:.76rem;color:var(--txt2)}
.lp-bar{flex:1;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.lp-fill{height:100%;background:var(--cr);border-radius:3px;transition:width .4s}
.lxp{font-size:.78rem;font-weight:700;color:var(--cr)}
.lesson-body{padding:18px 16px}
.ls-title{font-family:var(--ffs);font-size:1.3rem;font-weight:600;margin-bottom:14px}
.lesson-foot{position:sticky;bottom:0;background:var(--surf);border-top:1px solid var(--bdr);
  padding:13px 16px;display:flex;justify-content:space-between;gap:10px}
.lesson-foot .btn{flex:1}
.micro-steps{display:flex;gap:4px;padding:0 0 14px;overflow-x:auto}
.ms{flex-shrink:0;height:4px;border-radius:2px;background:var(--bg2);transition:background .3s;min-width:16px;flex:1}
.ms.done{background:var(--cr)}
.ms.cur{background:var(--cr);opacity:.5}

/* ── STEP TYPES ──────────────────────────────────────────────── */
.step-intro{font-size:.93rem;line-height:1.75;color:var(--txt2)}
.imm-bar-wrap{margin-top:14px;padding:11px 14px;background:var(--bg2);border-radius:var(--rs)}
.imm-label{display:flex;justify-content:space-between;font-size:.74rem;color:var(--txt2);margin-bottom:5px}
.imm-track{height:4px;background:var(--bdr);border-radius:2px;overflow:hidden}
.imm-fill{height:100%;background:linear-gradient(90deg,#1D4ED8,var(--cr));border-radius:2px}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vc{background:var(--bg2);border-radius:var(--rs);padding:13px;border:1px solid var(--bdr)}
.vc-fr{font-family:var(--ffs);font-size:1.05rem;font-weight:600;color:var(--cr);margin-bottom:2px}
.vc-pron{font-size:.72rem;color:var(--txt3);margin-bottom:4px}
.vc-mn{font-size:.82rem;font-weight:500;margin-bottom:6px}
.vc-acts{display:flex;gap:5px;flex-wrap:wrap}
.gram-card{background:var(--bg2);border-radius:var(--r);padding:16px}
.gram-title{font-family:var(--ffs);font-size:1rem;font-weight:600;color:var(--cr);margin-bottom:11px;text-align:center}
.conj-tbl{width:100%;border-collapse:collapse}
.conj-tbl tr{border-bottom:1px solid var(--bdr)}
.conj-tbl tr:last-child{border-bottom:none}
.cj-fr{padding:9px 11px;font-weight:600;cursor:pointer;color:var(--cr);font-family:var(--ffs);font-size:.95rem}
.cj-tr{padding:9px 11px;color:var(--txt2);font-size:.82rem}
.gram-note{background:#FFFBEB;border-left:2px solid #FCD34D;padding:9px 13px;border-radius:0 var(--rs) var(--rs) 0;font-size:.82rem;margin-top:11px;color:var(--gold);line-height:1.6}
.gram-note-ui{background:#EFF6FF;border-left:2px solid #1D4ED8;padding:9px 13px;border-radius:0 var(--rs) var(--rs) 0;font-size:.82rem;line-height:1.6;margin-top:9px}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt-btn{background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--rs);padding:13px 11px;
  text-align:left;font-size:.84rem;font-weight:500;cursor:pointer;min-height:50px;line-height:1.4;transition:all var(--tr)}
.opt-btn:hover:not(:disabled){background:var(--cr-lt);border-color:var(--cr)}
.opt-btn.ok{background:#F0FDF4;border-color:#15803D;color:#14532D}
.opt-btn.no{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}
.feedback-box{padding:11px 13px;border-radius:var(--rs);margin-top:11px;font-size:.84rem;line-height:1.5;display:none}
.fb-ok{background:#F0FDF4;border:1px solid #15803D;color:#14532D}
.fb-no{background:#FEF2F2;border:1px solid #DC2626;color:#7F1D1D}
.fill-inp{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:.93rem}
.fill-inp:focus{outline:none;border-color:var(--cr)}
.fill-hint{font-size:.78rem;color:var(--txt3);margin-top:7px}
.sum-box{background:linear-gradient(135deg,var(--cr-lt),var(--surf));border-radius:var(--r);padding:20px;text-align:center}
.sum-score{font-family:var(--ffs);font-size:1.6rem;font-weight:700;color:var(--cr);margin-bottom:14px}
.sum-list{text-align:left;list-style:none;display:flex;flex-direction:column;gap:7px}
.sum-list li{padding:8px 12px;background:rgba(255,255,255,.8);border-radius:var(--rs);font-size:.84rem}
.dial-box{display:flex;flex-direction:column;gap:13px}
.dial-line{display:flex;flex-direction:column;gap:3px}
.dial-line.b{align-items:flex-end}
.spk-name{font-size:.68rem;font-weight:600;color:var(--txt3);padding:0 4px}
.bubble{background:var(--bg2);border-radius:14px;border-top-left-radius:3px;padding:11px 13px;max-width:88%}
.b .bubble{background:var(--cr-lt);border-radius:14px;border-top-right-radius:3px}
.bbl-fr{font-weight:500;margin-bottom:3px;line-height:1.5;font-size:.88rem}
.bbl-tr{font-size:.76rem;color:var(--txt2);font-style:italic}

/* ── DRAG DROP ───────────────────────────────────────────────── */
.dd-zone{min-height:50px;border:1.5px dashed var(--cr);border-radius:var(--rs);padding:11px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--cr-lt);margin-bottom:12px}
.dd-ph{color:var(--txt3);font-size:.8rem;font-style:italic}
.dd-bank{display:flex;flex-wrap:wrap;gap:7px;padding:11px;background:var(--bg2);border-radius:var(--rs)}
.dd-w{background:var(--surf);border:1.5px solid var(--bdr);border-radius:7px;padding:8px 12px;font-size:.84rem;
  font-weight:500;cursor:grab;user-select:none;transition:all .18s}
.dd-w:hover{border-color:var(--cr);color:var(--cr)}
.dd-w.placed{background:var(--cr);color:#fff;border-color:var(--cr);cursor:pointer}

/* ── PLACEMENT / QUIZ ────────────────────────────────────────── */
.qhdr{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--bdr)}
.qpbar{flex:1;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.qbody{padding:18px 16px}
.qquestion{font-size:1rem;font-weight:500;margin-bottom:16px;line-height:1.6}
.qresult{text-align:center;padding:28px 18px}
.qr-em{font-size:3rem;margin-bottom:12px}
.qr-sc{font-family:var(--ffs);font-size:2.4rem;font-weight:700;color:var(--cr);margin:11px 0}
.qr-acts{display:flex;gap:11px;margin-top:18px;justify-content:center}

/* ── FLASHCARDS ──────────────────────────────────────────────── */
.fc-card{background:var(--bg2);border-radius:var(--rl);padding:32px 18px;text-align:center;min-height:200px;
  cursor:pointer;border:1.5px solid var(--bdr);transition:all .3s}
.fc-card:hover{border-color:var(--cr);box-shadow:var(--sh2)}
.fc-word{font-family:var(--ffs);font-size:1.9rem;font-weight:700;color:var(--cr);margin-bottom:7px}
.fc-pron{font-size:.9rem;color:var(--txt2);margin-bottom:12px}
.fc-mn{font-size:1.2rem;font-weight:600;margin-bottom:9px}
.fc-ex{font-size:.84rem;color:var(--txt2);font-style:italic}
.fc-back{display:none}
.fc-card.flipped .fc-front{display:none}
.fc-card.flipped .fc-back{display:block}
.fc-rating-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.sr-fail{background:#FEF2F2;color:#991B1B;border:1.5px solid #DC2626;padding:11px}
.sr-hard{background:#FFFBEB;color:#78350F;border:1.5px solid #FCD34D;padding:11px}
.sr-ok{background:#EFF6FF;color:#1E3A5F;border:1.5px solid #1D4ED8;padding:11px}
.sr-easy{background:#F0FDF4;color:#14532D;border:1.5px solid #15803D;padding:11px}

/* ── AI CHAT ─────────────────────────────────────────────────── */
.ai-chat-box{max-height:93vh;display:flex;flex-direction:column}
.ai-chdr{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--bdr)}
.ai-msgs{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:11px;min-height:160px;max-height:40vh}
.ai-msg-u{align-items:flex-end;display:flex;flex-direction:column}
.ai-msg-b{align-items:flex-start;display:flex;flex-direction:column}
.ai-bbl{max-width:88%;padding:9px 13px;border-radius:13px;font-size:.84rem;line-height:1.6}
.ai-msg-u .ai-bbl{background:var(--cr);color:#fff;border-bottom-right-radius:3px}
.ai-msg-b .ai-bbl{background:var(--bg2);border-bottom-left-radius:3px;border:1px solid var(--bdr)}
.ai-typing{letter-spacing:4px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.ai-sugg{display:flex;gap:7px;padding:7px 13px;overflow-x:auto;border-top:1px solid var(--bdr)}
.ai-sugg button{flex-shrink:0;background:var(--bg2);border:1px solid var(--bdr);border-radius:15px;
  padding:6px 12px;font-size:.74rem;cursor:pointer;white-space:nowrap;transition:all var(--tr)}
.ai-sugg button:hover{background:var(--cr-lt);border-color:var(--cr);color:var(--cr)}
.ai-inp-row{display:flex;gap:9px;padding:11px 13px;border-top:1px solid var(--bdr)}
.ai-inp-row input{flex:1;padding:9px 13px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:.88rem}
.ai-inp-row input:focus{outline:none;border-color:var(--cr)}

/* ── TRANSLATOR ──────────────────────────────────────────────── */
.trans-hdr{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bdr)}
.trans-dir{display:flex;align-items:center;justify-content:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--bdr)}
.tdir-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--bdr);font-weight:600;font-size:.82rem;cursor:pointer;background:none;color:var(--txt2);transition:all var(--tr)}
.tdir-btn.active{background:var(--cr);border-color:var(--cr);color:#fff}
.tswap{background:none;border:1px solid var(--bdr);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.86rem;display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.tswap:hover{background:var(--cr-lt)}
.trans-panels{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--bdr)}
.tpanel{padding:11px 13px;position:relative}
.tpanel:first-child{border-right:1px solid var(--bdr)}
.tpanel label{display:block;font-size:.7rem;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.tpanel textarea{width:100%;border:none;background:none;resize:none;font-size:.9rem;color:var(--txt);font-family:inherit;outline:none;min-height:80px}
.trans-out{min-height:80px;font-size:.9rem;color:var(--txt);line-height:1.6}
.trans-note-box{background:#FFFBEB;padding:7px 12px;border-radius:var(--rs);color:var(--gold);font-size:.78rem;border-left:2px solid #FCD34D;margin:9px 13px}

/* ── COMPLETION ──────────────────────────────────────────────── */
.comp-modal{text-align:center;padding:28px 18px}
.comp-ic{font-size:3.2rem;margin-bottom:11px}
.comp-stats{display:flex;justify-content:center;gap:22px;margin:13px 0;padding:13px;background:var(--bg2);border-radius:var(--rs)}
.comp-stats strong{display:block;font-family:var(--ffs);font-size:1.3rem;color:var(--cr);font-weight:700}
.comp-stats small{font-size:.68rem;color:var(--txt3)}

/* ── FABs ────────────────────────────────────────────────────── */
.fab{position:fixed;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:200;cursor:pointer;border:none;font-size:1.3rem;transition:all var(--tr)}
.fab:hover{transform:scale(1.1)}
.fab-ai{background:var(--cr);color:#fff;bottom:74px;right:14px;box-shadow:0 4px 16px rgba(185,28,28,.35)}
.fab-tr{background:#1D4ED8;color:#fff;bottom:134px;right:14px;box-shadow:0 4px 16px rgba(29,78,216,.3)}

/* ── TOASTS ──────────────────────────────────────────────────── */
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1C1917;color:#fff;
  padding:9px 22px;border-radius:20px;font-size:.84rem;z-index:1000;white-space:nowrap;
  animation:toast-a 2.8s ease forwards;pointer-events:none}
.xp-toast{position:fixed;bottom:76px;right:14px;background:var(--cr);color:#fff;padding:7px 16px;
  border-radius:20px;font-weight:700;font-size:.82rem;z-index:1000;animation:toast-a 2.2s ease forwards;pointer-events:none}
@keyframes toast-a{0%{opacity:0;transform:translateX(-50%) translateY(8px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

/* ── ONBOARDING ──────────────────────────────────────────────── */
.ob-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px);transition:opacity .4s}
.ob-box{background:var(--surf);border-radius:var(--rl);padding:24px 20px;max-width:460px;width:100%;max-height:93vh;overflow-y:auto;animation:slideUp .3s ease}
.ob-logo{display:flex;justify-content:center;margin-bottom:16px}
.ob-steps{display:flex;gap:7px;justify-content:center;margin-bottom:16px}
.ob-dot{width:28px;height:4px;border-radius:2px;background:var(--bdr);transition:background .3s}
.ob-dot.active{background:var(--cr)}
.ob-dot.done{background:var(--cr);opacity:.4}
.ob-title{font-family:var(--ffs);font-size:1.2rem;font-weight:600;text-align:center;margin-bottom:5px;line-height:1.4}
.ob-title span{font-size:.88rem;color:var(--txt2);display:block;margin-top:3px}
.ob-sub{text-align:center;color:var(--txt2);font-size:.82rem;line-height:1.6;margin-bottom:13px}
.ob-search{width:100%;padding:9px 13px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);font-size:.88rem;margin-bottom:9px}
.ob-search:focus{outline:none;border-color:var(--cr)}
.ob-lang-list{max-height:230px;overflow-y:auto;border:1px solid var(--bdr);border-radius:var(--rs);margin-bottom:4px}
.ob-lang-btn{width:100%;display:flex;align-items:center;gap:11px;padding:10px 13px;border:none;background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--bg2);transition:background .15s;font-size:.86rem}
.ob-lang-btn:last-child{border-bottom:none}
.ob-lang-btn:hover{background:var(--bg2)}
.ob-lang-btn.sel{background:var(--cr-lt);color:var(--cr)}
.ob-flag{font-size:1.2rem;width:24px;text-align:center;flex-shrink:0}
.ob-native{font-weight:600;flex:1}
.ob-en{font-size:.74rem;color:var(--txt3)}
.ob-chk{margin-left:auto;font-size:.95rem}
.ob-lang-btn.sel .ob-chk{color:var(--cr)}
.ob-nav{display:flex;gap:11px;margin-top:13px}
.ob-nav .btn{flex:1}
.ai-pick-pill{background:linear-gradient(135deg,#1C1917,#2C1D1D);color:#fff;padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:600;margin:0 auto 13px;display:block;width:fit-content;letter-spacing:.5px}
.ob-result{text-align:center}
.chosen-card{display:flex;align-items:center;gap:13px;background:var(--cr-lt);border:1.5px solid var(--cr-md);border-radius:var(--r);padding:13px 16px;margin:0 auto 11px;text-align:left;max-width:260px}
.chosen-flag{font-size:2rem}
.chosen-nm{font-size:1.05rem;font-weight:700;color:var(--cr)}
.chosen-sub{font-size:.74rem;color:var(--txt2)}
.chosen-chk{margin-left:auto;font-size:1.2rem;color:var(--cr);font-weight:700}
.ob-reason{font-size:.8rem;color:var(--txt2);line-height:1.6;padding:9px 13px;background:var(--bg2);border-radius:var(--rs);margin-bottom:11px}
.ob-also{display:flex;flex-direction:column;gap:3px;margin-bottom:11px;font-size:.76rem;color:var(--txt3)}
.ob-override{margin-bottom:13px;text-align:center}
.ob-override small{display:block;margin-bottom:5px;color:var(--txt3);font-size:.76rem}
.ob-override select{padding:7px 11px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--surf);color:var(--txt);font-size:.82rem;width:100%}
.ob-lvl-sec{text-align:left;margin-top:13px}
.ob-lvl-sec h3{font-size:.9rem;margin-bottom:9px;text-align:center}
.ob-lvl-list{display:flex;flex-direction:column;gap:7px}
.ob-lvl-btn{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--rs);cursor:pointer;text-align:left;transition:all .18s;font-size:.84rem}
.ob-lvl-btn:hover,.ob-lvl-btn.sel{border-color:var(--cr);background:var(--cr-lt)}
.ob-lvl-btn.hl{border-color:#FCD34D;background:#FFFBEB}
.ob-lvl-btn .li{font-size:1.2rem;width:24px;text-align:center;flex-shrink:0}
.ob-lvl-btn strong{display:block;font-size:.84rem;margin-bottom:2px}
.ob-lvl-btn small{color:var(--txt3);font-size:.72rem}

/* ── RTL ─────────────────────────────────────────────────────── */
body.rtl .sidebar{left:auto;right:-300px}

function load(){
  try{
    const r=localStorage.getItem(SK);
    if(!r) return;
    const parsed=JSON.parse(r);
    // Prevent prototype pollution
    if(typeof parsed!=='object'||parsed===null||Array.isArray(parsed)) return;
    // Only merge known keys (allowlist)
    const ALLOWED=['xp','streak','lastStudy','placementDone','placementLevel',
      'currentLevel','startLevelId','currentLevelId','completedLevels',
      'completedBands','wordbook','settings','dailyChalDate','dailyChalXP',
      'onboardingDone','uiLang','nativeLang','knownLangs'];

function chooseLang(native,known=[]){
  const all=[native,...known].filter(Boolean);
  const romance=['es','it','pt'];
  for(const l of all) if(romance.includes(l)) return {lang:l,reason:'romance'};
  if(all.includes('en')) return {lang:'en',reason:'english'};
  const prox={es:10,it:10,pt:9,en:7,de:6,nl:5,ar:3,tr:3,ru:3,pl:3,fa:3,ur:3,zh:1,ja:1,ko:1,hi:2,id:4,ms:4,sw:2,other:3};
  let best=native||'en',bs=prox[best]||3;
  for(const l of all){const s=prox[l]||3;if(s>bs){best=l;bs=s;}}
  return {lang:best,reason:'best'};
}

/* ── TTS ─────────────────────────────────────────────────────── */
function speak(txt,lang='fr-FR'){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=lang; u.rate=parseFloat(S.settings?.speechRate||1);
  speechSynthesis.speak(u);
}
function speakSlow(txt){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='fr-FR'; u.rate=0.5;
  speechSynthesis.speak(u);
}

/* ── LESSON ──────────────────────────────────────────────────── */
let curLesson=null,lesStep=0,lesScore=0;
function startLevel(id){
  const lvl=LVS.find(l=>l.id===id);if(!lvl)return;
  const content=LC[lvl.lessons[0]];
  if(!content){toast('Contenu disponible prochainement! 🚧');return;}
  curLesson={lvl,content};lesStep=0;lesScore=0;
  openM('m-lesson');renderLesStep();
}
function renderLesStep(){
  const box=$('m-lesson')?.querySelector('.modal-box');if(!box)return;
  const {content}=curLesson;
  const step=content.steps[lesStep];
  const total=content.steps.length;
  const pct=Math.round((lesStep/total)*100);
  const isLast=lesStep===total-1;
  box.innerHTML=`
    <div class="lesson-hdr">
      <button class="btn-ic" onclick="closeM('m-lesson')">✕</button>
      <div class="lp-wrap">
        <div class="lp-bar"><div class="lp-fill" style="width:${pct}%"></div></div>
        <span>${lesStep+1}/${total}</span>
      </div>
      <div class="lxp">⭐ ${lesScore}</div>
    </div>
    <div class="lesson-body">
      <div class="micro-steps">
        ${Array.from({length:total},(_,i)=>`<div class="ms ${i<lesStep?'done':i===lesStep?'cur':''}"></div>`).join('')}
      </div>
      <div class="ls-title">${escH(step.title)}</div>
      ${renderStep(step)}
    </div>
    <div class="lesson-foot">
      ${lesStep>0?`<button class="btn btn-g" onclick="prevLes()">${t('bk')}</button>`:'<div></div>'}
      <button class="btn btn-p" id="les-nxt" onclick="nextLes()">
        ${isLast?t('fin'):t('nxt')}
      </button>
    </div>`;
}
function renderStep(s){
  if(s.type==='intro')    return renderIntro(s);
  if(s.type==='vocab')    return renderVocab(s);
  if(s.type==='grammar')  return renderGrammar(s);
  if(s.type==='exercise') return renderExercise(s);
  if(s.type==='fill')     return renderFill(s);
  if(s.type==='dragdrop') return renderDD(s);
  if(s.type==='dialogue') return renderDialogue(s);
  if(s.type==='summary')  return renderSummary(s);
  return '';
}
function renderIntro(s){
  const pct=immPct();
  return `<p class="step-intro">${escH(s.text)}</p>
    <div class="imm-bar-wrap">
      <div class="imm-label">
        <span style="font-size:.72rem">${pct<40?'🌐 Explanation: your language':'🇫🇷 French immersion'}</span>
        <span style="color:var(--cr);font-weight:700">🇫🇷 ${pct}%</span>
      </div>
      <div class="imm-track"><div class="imm-fill" style="width:${pct}%"></div></div>
    </div>`;
}
function renderVocab(s){
  return `<div class="vocab-grid">
    ${s.words.map(w=>{
      const cog=getCog(w.fr);
      return `<div class="vc">
        <div class="vc-fr">${escH(w.fr)}</div>
        <div class="vc-pron">/${escH(w.pron||'')}/</div>
        <div class="vc-mn">${escH(w.meaning)}</div>

function renderGrammar(s){
  const r=s.rule;

    <div class="gram-title">${escH(r.title)}</div>

let _exDone=false;
function renderExercise(s){
  _exDone=false;
  return `<p class="qquestion">${escH(s.question)}</p>
    <div class="opts-grid">
      ${s.opts.map((o,i)=>`<button class="opt-btn" onclick="checkEx(${i},${s.ans},'${escH(s.exp).replace(/'/g,"&#39;")}',this)">${escH(o)}</button>`).join('')}

}
function checkEx(c,ans,exp,btn){
  if(_exDone)return;_exDone=true;
  const ok=c===ans;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.disabled=true;if(i===ans)b.classList.add('ok');if(i===c&&!ok)b.classList.add('no');});
  const fb=$('ex-fb');
  if(fb){fb.style.display='block';fb.className=`feedback-box ${ok?'fb-ok':'fb-no'}`;
    fb.innerHTML=`${ok?t('ok'):t('no')} ${escH(exp)}`+((!ok)?` <button class="btn-tts" style="margin-left:7px" onclick="askAI('${escH(exp)}')">${t('why')}</button>`:'');}

function renderFill(s){
  return `<div class="gram-card">
    <p style="font-size:.93rem;margin-bottom:11px">${escH(s.prompt)}</p>
    <input class="fill-inp" type="text" placeholder="Votre réponse..." id="fill-ans"
      onkeydown="if(event.key==='Enter')checkFill()"/>
    <p class="fill-hint">💡 ${t('tip')}: ${escH(s.hint)}</p>
    <div class="feedback-box" id="fill-fb" style="margin-top:9px"></div>
    <button class="btn btn-p" style="margin-top:9px;width:100%" onclick="checkFill()">Vérifier ✓</button>
  </div>`;
}
function checkFill(){
  const inp=$('fill-ans');if(!inp)return;
  const step=curLesson.content.steps[lesStep];
  const val=inp.value.trim().toLowerCase();
  const ans=step.answer.toLowerCase();
  const ok=val===ans;
  const fb=$('fill-fb');
  if(fb){fb.style.display='block';fb.className=`feedback-box ${ok?'fb-ok':'fb-no'}`;
    fb.textContent=ok?`${t('ok')} "${step.answer}" ✅`:`${t('no')} Réponse: "${step.answer}"`;}
  if(ok){lesScore+=10;inp.disabled=true;}
}
let ddPlaced=[];
function renderDD(s){
  ddPlaced=[];
  const sh=[...s.words].sort(()=>Math.random()-.5);
  return `<p style="font-size:.82rem;color:var(--txt2);margin-bottom:11px">${escH(s.instruction)}</p>
    <div class="dd-zone" id="dd-zone"><span class="dd-ph" id="dd-ph">Déposez les mots ici...</span></div>
    <div class="dd-bank" id="dd-bank">
      ${sh.map((w,i)=>`<div class="dd-w" data-w="${escH(w)}" onclick="ddClick(this)">${escH(w)}</div>`).join('')}
    </div>
    <div class="feedback-box" id="dd-fb" style="margin-top:9px"></div>
    <button class="btn btn-o" style="margin-top:9px;width:100%" onclick="checkDD('${escH(s.correct)}')">Vérifier ✓</button>`;
}
function ddClick(el){
  const zone=$('dd-zone');const ph=$('dd-ph');
  if(el.classList.contains('placed')){
    ddPlaced=ddPlaced.filter(w=>w!==el.dataset.w);el.classList.remove('placed');
  }else{ddPlaced.push(el.dataset.w);el.classList.add('placed');}
  if(ph) ph.style.display=ddPlaced.length?'none':'';
  zone.querySelectorAll('.dd-w').forEach(e=>e.remove());
  ddPlaced.forEach(w=>{const d=document.createElement('div');d.className='dd-w placed';d.textContent=w;
    d.onclick=()=>{ddPlaced=ddPlaced.filter(x=>x!==w);d.remove();const src=document.querySelector(`[data-w="${w}"]`);if(src)src.classList.remove('placed');if(ph&&!ddPlaced.length)ph.style.display='';};
    zone.appendChild(d);});
}
function checkDD(correct){
  const ans=ddPlaced.join(' ').trim();const ok=ans===correct.trim();
  const fb=$('dd-fb');if(fb){fb.style.display='block';fb.className=`feedback-box ${ok?'fb-ok':'fb-no'}`;
    fb.textContent=ok?`${t('ok')} ✅`:`${t('no')} Correct: "${correct}"`;}
  if(ok)lesScore+=10;
}
function renderDialogue(s){
  return `<div class="dial-box">
    ${s.lines.map(l=>`
      <div class="dial-line ${l.b?'b':''}">
        <span class="spk-name">${escH(l.speaker)}</span>
        <div class="bubble">
          <div class="bbl-fr">${escH(l.fr)}</div>
          <div class="bbl-tr">${escH(l.tr)}</div>
          <button class="btn-tts" style="margin-top:5px" onclick="speak('${escH(l.fr)}')">🔊</button>
          <button class="btn-slow" onclick="speakSlow('${escH(l.fr)}')">🐢</button>
        </div>
      </div>`).join('')}
  </div>`;
}
function renderSummary(s){
  return `<div class="sum-box">
    <div class="sum-score">🏆 ${lesScore} pts</div>
    <ul class="sum-list">
      ${s.points.map(p=>`<li>✓ ${escH(p)}</li>`).join('')}
    </ul>
  </div>`;
}
function nextLes(){
  const steps=curLesson?.content?.steps;if(!steps)return;
  if(lesStep<steps.length-1){lesStep++;renderLesStep();}else finishLesson();
}
function prevLes(){if(lesStep>0){lesStep--;renderLesStep();}}
function finishLesson(){
  const lvl=curLesson?.lvl;if(!lvl)return;
  if(!S.completedLevels)S.completedLevels=[];
  if(!S.completedLevels.includes(lvl.id)){
    S.completedLevels.push(lvl.id);
    if(lvl.id>=S.currentLevelId)S.currentLevelId=Math.min(lvl.id+1,30);
    xpToast(lvl.xp);updateStreak();
  }
  save();closeM('m-lesson');showComp(lvl);
}

/* ── PLACEMENT ───────────────────────────────────────────────── */
const PLQ=[
  {q:'What does "Bonjour" mean?',opts:['Goodbye','Hello','Thank you','Please'],ans:1,lvl:'pre-a1'},
  {q:'Complete: "Je ___ étudiant." (I am a student.)',opts:['suis','es','est','sommes'],ans:0,lvl:'a1'},
  {q:'What is the article for a masculine noun in French?',opts:['la','les','le','une'],ans:2,lvl:'a1'},
  {q:'How do you say "I ate" (past tense)?',opts:['Je mange','Je mangeais','J\'ai mangé','Je mangerai'],ans:2,lvl:'a2'},
  {q:'Complete: "Je ___ allé au cinéma." (I went to the cinema.)',opts:['ai','est','suis','a'],ans:2,lvl:'a2'},
  {q:'Which tense is "Je parlais"?',opts:['Passé composé','Futur','Imparfait','Subjonctif'],ans:2,lvl:'b1'},
  {q:'"Il faut que tu viennes" uses which mood?',opts:['Indicatif','Subjonctif','Conditionnel','Impératif'],ans:1,lvl:'b1'},
  {q:'"Nonobstant" means:',opts:['Nevertheless','Actually','Nowadays','Similarly'],ans:0,lvl:'c1'},
  {q:'What is the subjunctive of "être"? "Il faut que tu ___"',opts:['es','soit','sois','serait'],ans:2,lvl:'b1'},
  {q:'"Les affres de la mort" means:',opts:['The agonies of death','The affairs of death','The offers of death','The effects of death'],ans:0,lvl:'c2'},
];
let plStep=0,plScores={};
function startPlacement(){plStep=0;plScores={};openM('m-placement');renderPl();}
function renderPl(){
  const box=$('m-placement')?.querySelector('.modal-box');if(!box)return;
  if(plStep>=PLQ.length){finishPl();return;}
  const q=PLQ[plStep];const pct=Math.round((plStep/PLQ.length)*100);
  box.innerHTML=`
    <div class="qhdr">
      <button class="btn-ic" onclick="closeM('m-placement')">✕</button>
      <div class="qpbar"><div style="height:100%;width:${pct}%;background:var(--cr);border-radius:3px"></div></div>
      <span style="font-size:.76rem;color:var(--txt2)">${plStep+1}/${PLQ.length}</span>
    </div>
    <div class="qbody">
      <div style="font-size:.74rem;font-weight:700;color:var(--cr);margin-bottom:11px;letter-spacing:.5px">🎯 TEST DE PLACEMENT</div>
      <p class="qquestion">${escH(q.q)}</p>
      <div class="opts-grid">
        ${q.opts.map((o,i)=>`<button class="opt-btn" onclick="answerPl(${i},${q.ans},'${q.lvl}',this)">${escH(o)}</button>`).join('')}
      </div>
    </div>`;
}
function answerPl(c,ans,lvl,btn){
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.disabled=true;if(i===ans)b.classList.add('ok');if(i===c&&c!==ans)b.classList.add('no');});
  if(c===ans)plScores[lvl]=(plScores[lvl]||0)+1;
  setTimeout(()=>{plStep++;renderPl();},700);
}
function finishPl(){
  const sc=plScores;let level='pre-a1';
  if(sc['c2']>=1)level='c2';
  else if(sc['c1']>=1)level='c1';
  else if((sc['b1']||0)>=2)level='b2';
  else if((sc['b1']||0)>=1)level='b1';
  else if((sc['a2']||0)>=1)level='a2';
  else if((sc['a1']||0)>=1)level='a1';
  const idxMap={'pre-a1':1,'a1':6,'a2':11,'b1':16,'b2':21,'c1':26,'c2':29};
  S.placementDone=true;S.placementLevel=level;S.currentLevel=level;
  S.startLevelId=idxMap[level]||1;S.currentLevelId=idxMap[level]||1;

function renderWBList(words){
  return words.map(w=>{
    const cog=getCog(w.fr);

      <div class="wc-pron">/${escH(w.pron||'')}/ <button class="btn-tts" onclick="speak('${escH(w.fr)}')">🔊</button> <button class="btn-slow" onclick="speakSlow('${escH(w.fr)}')">🐢</button></div>

      </div>
    </div>`;
  }).join('');
}
function filterWB(q){
  const lf=($('wb-lf')||{}).value||'';
  const sf=($('wb-sf')||{}).value||'';
  let ws=S.wordbook||[];
  if(q)ws=ws.filter(w=>w.fr.toLowerCase().includes(q.toLowerCase())||w.meaning.toLowerCase().includes(q.toLowerCase()));
  if(lf)ws=ws.filter(w=>w.level===lf);
  if(sf)ws=ws.filter(w=>(w.state||'new')===sf);
  const el=$('wb-list');
  if(el)el.innerHTML=ws.length?renderWBList(ws):'<p style="text-align:center;color:var(--txt2);padding:18px">Aucun mot trouvé.</p>';
}
function addWB(fr,meaning,level){
  if(!S.wordbook)S.wordbook=[];
  if(S.wordbook.find(w=>w.fr===fr)){toast('Déjà dans le carnet!');return;}
  S.wordbook.push({fr,meaning,pron:'',ex:'',level:level||S.currentLevel||'a1',state:'new',added:new Date().toISOString()});
  save();toast(`📖 "${fr}" ajouté!`);
}

function exportD(){const a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,2));a.download='languway-french-backup.json';a.click();}
function importD(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const r=new FileReader();r.onload=ev=>{
  try{
    const d=JSON.parse(ev.target.result);
    // Validate it's our data structure
    if(typeof d!=='object'||d===null) throw new Error('invalid');
    if(typeof d.xp!=='undefined'&&typeof d.xp!=='number') throw new Error('invalid xp');
    if(typeof d.completedLevels!=='undefined'&&!Array.isArray(d.completedLevels)) throw new Error('invalid levels');
    // Max wordbook size check (prevent DoS via huge file)
    if(d.wordbook&&d.wordbook.length>5000) throw new Error('too large');
    Object.assign(S,d);save();toast('Importé! ✅');renderSettings();
  }catch(e){toast('Fichier invalide ou corrompu ❌');}
};r.readAsText(e.target.files[0]);};inp.click();}

/* ── QR CODE (pure SVG, no library) ─────────────────────────── */
function buildQR(url){
  // Simple visual QR placeholder with actual URL encoded
  const size=180;
  const encoded=encodeURIComponent(url);
  // Generate a simple visual QR-like pattern using SVG
  // For a real QR, we use a data URI approach
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="qr-svg" style="border:1px solid var(--bdr);border-radius:8px;padding:10px;background:#fff">
    <!-- Finder patterns -->
    <rect x="10" y="10" width="50" height="50" rx="6" fill="#1C1917"/>
    <rect x="17" y="17" width="36" height="36" rx="3" fill="#fff"/>
    <rect x="23" y="23" width="24" height="24" rx="2" fill="#1C1917"/>
    <rect x="120" y="10" width="50" height="50" rx="6" fill="#1C1917"/>
    <rect x="127" y="17" width="36" height="36" rx="3" fill="#fff"/>
    <rect x="133" y="23" width="24" height="24" rx="2" fill="#1C1917"/>
    <rect x="10" y="120" width="50" height="50" rx="6" fill="#1C1917"/>
    <rect x="17" y="127" width="36" height="36" rx="3" fill="#fff"/>
    <rect x="23" y="133" width="24" height="24" rx="2" fill="#1C1917"/>
    <!-- Data pattern (decorative, represents URL) -->
    ${generateQRPattern(url,size)}
    <!-- Center logo -->
    <rect x="72" y="72" width="36" height="36" rx="6" fill="#fff"/>
    <rect x="75" y="75" width="30" height="30" rx="4" fill="#B91C1C"/>
    <text x="90" y="97" font-family="sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">FR</text>
  </svg>`;
}

function generateQRPattern(url,size){
  // Generate a deterministic visual pattern based on URL hash
  let hash=0;for(let i=0;i<url.length;i++){hash=((hash<<5)-hash)+url.charCodeAt(i);hash|=0;}
  const cells=[];const step=8;
  for(let x=70;x<size-10;x+=step){
    for(let y=10;y<size-10;y+=step){
      // Skip finder pattern areas
      if((x<70&&y<70)||(x>110&&y<70)||(x<70&&y>110))continue;
      if(x>65&&x<115&&y>65&&y<115)continue;// Skip center
      const bit=(hash^(x*31+y*17))&1;
      if(bit)cells.push(`<rect x="${x}" y="${y}" width="${step-1}" height="${step-1}" fill="#1C1917" rx="1"/>`);
    }
  }
  return cells.join('');
}

  const p=phs[Math.floor(Math.random()*phs.length)];
  toast(`🎤 Dites: "${p}"`);setTimeout(()=>speak(p),500);
}

/* ── AI TUTOR ────────────────────────────────────────────────── */
let aiH=[];
function openAI(){
  const box=$('m-ai')?.querySelector('.modal-box');if(!box)return;
  aiH=[];
  box.innerHTML=`<div class="ai-chat-box">
    <div class="ai-chdr">
      <div style="font-size:1.5rem">🤖</div>
      <div style="flex:1"><strong>Tuteur IA</strong><div style="font-size:.72rem;color:var(--txt2)">Posez-moi n\'importe quelle question sur le français</div></div>
      <button class="btn-ic" onclick="closeM('m-ai')">✕</button>
    </div>
    <div class="ai-msgs" id="ai-msgs">
      <div class="ai-msg-b"><div class="ai-bbl">Bonjour! 👋 Je suis votre tuteur français IA. Posez-moi n\'importe quelle question — grammaire, vocabulaire, prononciation ou comparaisons avec votre langue!</div></div>
    </div>
    <div class="ai-sugg">
      <button onclick="sendAI('Pourquoi les noms français ont-ils un genre?')">Pourquoi le genre grammatical?</button>
      <button onclick="sendAI('Quelle est la différence entre être et avoir?')">être vs avoir?</button>
      <button onclick="sendAI('Comment former le passé composé?')">Passé composé?</button>
      <button onclick="sendAI('Quelles sont les phrases françaises les plus utiles?')">Phrases utiles?</button>
    </div>
    <div class="ai-inp-row">
      <input type="text" id="ai-inp" placeholder="Posez votre question..." onkeydown="if(event.key==='Enter')sendAI()"/>
      <button class="btn btn-p btn-sm" onclick="sendAI()">→</button>
    </div>
  </div>`;
  openM('m-ai');
}
// Rate limiter for AI calls
const _aiRL={count:0,reset:Date.now()+60000};
function checkAIRate(){
  const now=Date.now();
  if(now>_aiRL.reset){_aiRL.count=0;_aiRL.reset=now+60000;}
  if(_aiRL.count>=10){toast('Too many requests. Wait a moment. ⏳');return false;}
  _aiRL.count++;return true;
}
async function sendAI(txt){
  if(!checkAIRate()) return;
  const inp=$('ai-inp');
  const msg=(txt||inp?.value||'').trim().slice(0,500).replace(/<[^>]*>/g,'');if(!msg)return;
  if(inp)inp.value='';
  const msgs=$('ai-msgs');if(!msgs)return;
  msgs.innerHTML+=`<div class="ai-msg-u"><div class="ai-bbl">${escH(msg)}</div></div>`;
  msgs.innerHTML+=`<div class="ai-msg-b" id="ai-typing"><div class="ai-bbl"><span class="ai-typing">···</span></div></div>`;
  msgs.scrollTop=msgs.scrollHeight;
  aiH.push({role:'user',content:msg});
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,system:`You are a friendly and encouraging French language tutor on Languway French. The student's preferred explanation language is ${S.uiLang||'en'} (${LANGS.find(l=>l.c===S.uiLang)?.nat||'English'}). Their native language is ${S.nativeLang||'en'}. Always explain French grammar by comparing it to what the student already knows from their native language. Be concise, use examples, and be encouraging. If explaining a grammar concept, include the formula and 2-3 examples.`,messages:aiH})});
    const data=await r.json();
    const reply=data.content?.[0]?.text||'Désolé, connexion impossible. Réessayez.';
    aiH.push({role:'assistant',content:reply});
    document.getElementById('ai-typing')?.remove();
    if(msgs)msgs.innerHTML+=`<div class="ai-msg-b"><div class="ai-bbl">${escH(reply)}</div></div>`;
    if(msgs)msgs.scrollTop=msgs.scrollHeight;
  }catch{
    document.getElementById('ai-typing')?.remove();
    if(msgs)msgs.innerHTML+=`<div class="ai-msg-b"><div class="ai-bbl">Erreur de connexion. Vérifiez votre internet. 🔌</div></div>`;
  }
}
function askAI(exp){openAI();setTimeout(()=>sendAI(`Peux-tu expliquer plus clairement? Retour reçu: "${exp}"`),500);}

/* ── TRANSLATOR ──────────────────────────────────────────────── */
let tDir='fr-en';
function openTranslator(){
  const box=$('m-trans')?.querySelector('.modal-box');if(!box)return;
  box.innerHTML=`<div>
    <div class="trans-hdr">
      <span style="font-weight:600;flex:1">🔤 Traducteur</span>
      <button class="btn-ic" onclick="closeM('m-trans')">✕</button>
    </div>
    <div class="trans-dir">
      <button class="tdir-btn ${tDir==='fr-en'?'active':''}" onclick="setTDir('fr-en')">🇫🇷 FR</button>
      <button class="tswap" onclick="swapT()">⇄</button>
      <button class="tdir-btn ${tDir==='en-fr'?'active':''}" onclick="setTDir('en-fr')">🌐 ${(S.uiLang||'EN').toUpperCase()}</button>
    </div>
    <div class="trans-panels">
      <div class="tpanel">
        <label>${tDir==='fr-en'?'🇫🇷 Français':'🌐 Votre langue'}</label>
        <textarea id="t-inp" placeholder="Écrivez ici..." oninput="debTrans()"></textarea>
      </div>
      <div class="tpanel">
        <label>${tDir==='fr-en'?'🌐 Traduction':'🇫🇷 Français'}</label>
        <div class="trans-out" id="t-out"><span style="color:var(--txt3)">La traduction apparaît ici</span></div>
      </div>
    </div>
    <div style="padding:9px 13px;display:flex;gap:8px">
      <button class="btn-tts" onclick="speakT()">🔊 Écouter</button>
      <button class="btn-slow" onclick="speakTSlow()">🐢 Lent</button>
    </div>
    <div id="t-note"></div>
  </div>`;
  openM('m-trans');
}
let tTimer;
function debTrans(){clearTimeout(tTimer);tTimer=setTimeout(doTrans,600);}
function setTDir(d){tDir=d;openTranslator();}
function swapT(){tDir=tDir==='fr-en'?'en-fr':'fr-en';openTranslator();}
async function doTrans(){
  const inp=$('t-inp');const out=$('t-out');if(!inp||!out)return;
  const txt=inp.value.trim();if(!txt){out.textContent='';return;}
  out.innerHTML='<span style="color:var(--txt3)">Traduction...</span>';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:`Translate this ${tDir==='fr-en'?'French text to both English and also the student\'s language (${S.uiLang||"en"}). Format: English: ... / ${S.uiLang||"en"}: ...':'text to French. Just give the French translation'}]. Text: "${txt}"`}]})});
    const data=await r.json();
    out.textContent=data.content?.[0]?.text||'—';
  }catch{out.textContent='Erreur de traduction.';}
}
function speakT(){const v=($('t-inp')||{}).value;if(v)speak(v,tDir==='fr-en'?'fr-FR':'en-US');}
function speakTSlow(){const v=($('t-inp')||{}).value;if(v)speakSlow(v);}

/* ── ONBOARDING ──────────────────────────────────────────────── */
function needsOB(){return !S.onboardingDone||!S.uiLang;}
function startOB(){
  let ov=document.getElementById('ob-ov');
  if(!ov){ov=document.createElement('div');ov.id='ob-ov';ov.className='ob-overlay';document.body.appendChild(ov);}
  showOB1(ov);
}
function showOB1(ov){
  ov.innerHTML=`<div class="ob-box">
    <div class="ob-logo">
      <svg viewBox="0 0 200 48" fill="none" width="170">
        <circle cx="22" cy="24" r="18" fill="#B91C1C"/>
        <path d="M14 24 L22 10 L30 24" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <circle cx="30" cy="24" r="9" fill="none" stroke="white" stroke-width="2.5"/>
        <text x="46" y="30" font-family="Cormorant Garamond,serif" font-weight="700" font-size="20" fill="currentColor">Languway</text>
        <text x="46" y="44" font-family="Inter,sans-serif" font-weight="400" font-size="10" fill="#B91C1C" letter-spacing="4">FRENCH</text>
      </svg>
    </div>
    <div class="ob-steps"><div class="ob-dot active"></div><div class="ob-dot"></div><div class="ob-dot"></div></div>
    <h2 class="ob-title">What is your native language?<br/><span>ما هي لغتك الأم؟</span></h2>
    <p class="ob-sub">We'll explain French in a language you already understand perfectly.</p>
    <input class="ob-search" type="text" placeholder="Search / البحث..." oninput="flL('ob-nl',this.value)" autocomplete="off"/>
    <div class="ob-lang-list" id="ob-nl">
      ${LANGS.map(l=>`<button class="ob-lang-btn" data-c="${escH(l.c)}" onclick="selNat('${escH(l.c)}',this)">
        <span class="ob-flag">${l.f}</span><span class="ob-native">${escH(l.nat)}</span><span class="ob-en">${escH(l.n)}</span>
      </button>`).join('')}
    </div>
    <button class="btn btn-p" id="ob-b1" style="width:100%;margin-top:13px" disabled onclick="showOB2(document.getElementById('ob-ov'))">Continue →</button>
  </div>`;
}
function flL(id,q){const el=$(id);if(!el)return;el.querySelectorAll('.ob-lang-btn').forEach(b=>{b.style.display=b.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';});}
function selNat(c,btn){document.querySelectorAll('#ob-nl .ob-lang-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');S._native=c;const b=$('ob-b1');if(b)b.disabled=false;}
function showOB2(ov){
  ov.innerHTML=`<div class="ob-box">
    <div class="ob-steps"><div class="ob-dot done"></div><div class="ob-dot active"></div><div class="ob-dot"></div></div>
    <h2 class="ob-title">Other languages you know?</h2>
    <p class="ob-sub">Select all languages you can read or understand.<br/><small style="color:var(--txt3)">Helps us choose the best explanation language for you.</small></p>
    <input class="ob-search" type="text" placeholder="Search..." oninput="flL('ob-kl',this.value)" autocomplete="off"/>
    <div class="ob-lang-list" id="ob-kl">
      ${LANGS.filter(l=>l.c!==S._native&&l.c!=='other').map(l=>`<button class="ob-lang-btn" data-c="${escH(l.c)}" onclick="togKnown('${escH(l.c)}',this)">
        <span class="ob-flag">${l.f}</span><span class="ob-native">${escH(l.nat)}</span><span class="ob-en">${escH(l.n)}</span><span class="ob-chk">☐</span>
      </button>`).join('')}
    </div>
    <div class="ob-nav">
      <button class="btn btn-g" onclick="showOB1(document.getElementById('ob-ov'))">← Back</button>
      <button class="btn btn-p" onclick="showOB3(document.getElementById('ob-ov'))">Continue →</button>
    </div>
  </div>`;
  if(!S._known)S._known=[];
}
function togKnown(c,btn){
  if(!S._known)S._known=[];
  const h=S._known.includes(c);
  if(h){S._known=S._known.filter(x=>x!==c);btn.classList.remove('sel');btn.querySelector('.ob-chk').textContent='☐';}
  else{S._known.push(c);btn.classList.add('sel');btn.querySelector('.ob-chk').textContent='☑';}
}
function showOB3(ov){
  const res=chooseLang(S._native,S._known||[]);
  const chosen=LANGS.find(l=>l.c===res.lang)||LANGS[0];
  const native=LANGS.find(l=>l.c===S._native);
  const reasonMsg={
    romance:`Because you know ${LANGS.find(l=>(S._known||[]).includes(l.c)&&['es','it','pt'].includes(l.c))?.nat||'a Romance language'}, which is very close to French — this will accelerate your learning dramatically!`,
    english:'English has the richest French learning comparisons and explanations available.',
    best:'This is the language closest to French from your known languages.',
  }[res.reason]||'';
  S._chosenLang=res.lang;
  ov.innerHTML=`<div class="ob-box ob-result">
    <div class="ob-steps"><div class="ob-dot done"></div><div class="ob-dot done"></div><div class="ob-dot active"></div></div>
    <div class="ai-pick-pill">🤖 AI Language Selection</div>
    <div class="chosen-card"><div class="chosen-flag">${chosen.f}</div><div><div class="chosen-nm">${escH(chosen.nat)}</div><div class="chosen-sub">${escH(chosen.n)}</div></div><div class="chosen-chk">✓</div></div>
    <p class="ob-reason">${escH(reasonMsg)}</p>
    <div class="ob-also">
      <small>Native: <strong>${escH(native?.nat||S._native||'')}</strong></small>
      ${(S._known||[]).length?`<small>Also speaks: ${(S._known||[]).map(c=>LANGS.find(l=>l.c===c)?.nat||c).join(', ')}</small>`:''}
    </div>
    <div class="ob-override">
      <small>Prefer a different explanation language?</small>
      <select onchange="S._chosenLang=this.value||'${res.lang}'">
        <option value="">— Keep AI suggestion (${escH(chosen.nat)}) —</option>
        ${LANGS.filter(l=>l.c!=='other').map(l=>`<option value="${escH(l.c)}" ${l.c===res.lang?'selected':''}>${l.f} ${escH(l.nat)}</option>`).join('')}
      </select>
    </div>
    <div class="ob-lvl-sec">
      <h3>What is your French level?</h3>
      <div class="ob-lvl-list">
        ${[['zero','🌱','Complete beginner','No French at all',false],
           ['basic','📗','Know some words','Bonjour, merci, au revoir...',false],
           ['mid','📘','Basic conversations','Simple sentences & phrases',false],
           ['advanced','📙','Intermediate+','I speak French fairly well',false],
           ['test','🎯','Placement test','30 questions — most precise',true],
        ].map(([id,ic,title,desc,hl])=>`
          <button class="ob-lvl-btn ${hl?'hl':''}" onclick="selLevel('${id}',this)">
            <span class="li">${ic}</span>
            <div><strong>${escH(title)}</strong><small>${escH(desc)}</small></div>
          </button>`).join('')}
      </div>
    </div>
    <div class="ob-nav">
      <button class="btn btn-g" onclick="showOB2(document.getElementById('ob-ov'))">← Back</button>
      <button class="btn btn-p" id="ob-b3" disabled onclick="finishOB()">🚀 Start Learning →</button>
    </div>
  </div>`;
}
let _doPlacement=false;
function selLevel(lvl,btn){
  document.querySelectorAll('.ob-lvl-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');
  _doPlacement=lvl==='test';
  const m={zero:'pre-a1',basic:'a1',mid:'a2',advanced:'b1',test:'a1'};
  S._chosenLevel=m[lvl]||'a1';
  const b=$('ob-b3');if(b)b.disabled=false;
}
function finishOB(){
  S.uiLang=S._chosenLang||S._native||'en';
  S.nativeLang=S._native||'en';S.knownLangs=S._known||[];S.onboardingDone=true;
  if(!_doPlacement){
    S.currentLevel=S._chosenLevel||'a1';S.placementDone=true;
    const im={'pre-a1':1,'a1':6,'a2':11,'b1':16,'b2':21};
    S.startLevelId=im[S.currentLevel]||1;S.currentLevelId=S.startLevelId;
  }
  if(isRTL(S.uiLang)){document.body.setAttribute('dir','rtl');document.body.classList.add('rtl');}
  else{document.body.removeAttribute('dir');document.body.classList.remove('rtl');}
  save();updateChip();
  const ov=document.getElementById('ob-ov');
  if(ov){ov.style.opacity='0';setTimeout(()=>ov.remove(),400);}
  if(_doPlacement)setTimeout(()=>startPlacement(),500);else nav('home');
}
function changeUILang(){S.onboardingDone=false;startOB();}

/* ── STREAK ──────────────────────────────────────────────────── */
function updateStreak(){
  const today=new Date().toDateString();
  if(S.lastStudy===today)return;
  const yd=new Date();yd.setDate(yd.getDate()-1);
  S.streak=(S.lastStudy===yd.toDateString())?(S.streak||0)+1:1;
  S.lastStudy=today;
}

/* ── SPLASH ──────────────────────────────────────────────────── */
function skipSplash(){
  const sp=$('splash');
  if(sp){sp.style.opacity='0';setTimeout(()=>{sp.style.display='none';$('app').style.display='flex';$('fab-ai').style.display='flex';$('fab-tr').style.display='flex';if(needsOB())setTimeout(startOB,300);else{renderHome();nav('home');}},300);}
}

/* ── INIT ────────────────────────────────────────────────────── */
function init(){
  load();
  if(S.settings?.darkMode)document.body.classList.add('dark');
  if(S.settings?.fontSize)document.documentElement.style.fontSize=S.settings.fontSize+'px';
  if(isRTL(S.uiLang)){document.body.setAttribute('dir','rtl');document.body.classList.add('rtl');}
  updateChip();
  // Update splash tagline
  const tag=$('spl-tag');
  if(tag){const tgs=['Apprenez le français','تعلّم الفرنسية','Aprende francés','Lerne Französisch','Impara il francese'];tag.textContent=tgs[Math.floor(Math.random()*tgs.length)];}
  setTimeout(()=>{
    const sp=$('splash');
    if(sp){sp.style.opacity='0';setTimeout(()=>{sp.style.display='none';$('app').style.display='flex';$('fab-ai').style.display='flex';$('fab-tr').style.display='flex';if(needsOB())setTimeout(startOB,300);else{renderHome();nav('home');}},500);}
  },3000);
}
document.addEventListener('DOMContentLoaded',init);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
