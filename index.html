<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#C8102E"/>
<meta name="description" content="Languway French — Learn French from Pre-A1 to C2"/>
<title>Languway French</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet"/>
<style>
/* ================================================================
   LANGUWAY FRENCH — Complete Design System
   ================================================================ */
:root{
  --red:#C8102E;--red-dark:#8B0A1F;--red-light:#FFE5EA;
  --navy:#1a1a2e;--bg:#FAFAF8;--bg2:#F3F3F0;--surface:#FFFFFF;
  --border:#E5E5E0;--text:#1a1a2e;--text2:#5a5a6a;--text3:#9a9aaa;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-md:0 4px 24px rgba(0,0,0,.12);
  --radius:12px;--radius-sm:8px;--radius-lg:20px;--transition:.22s ease;
}
.dark{
  --bg:#0f0f1a;--bg2:#1a1a2e;--surface:#1e1e30;--border:#2e2e45;
  --text:#f0f0f8;--text2:#a0a0c0;--text3:#60607a;
  --shadow:0 2px 12px rgba(0,0,0,.35);--shadow-md:0 4px 24px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--transition),color var(--transition)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:1rem}

/* SPLASH */
#splash{position:fixed;inset:0;background:linear-gradient(145deg,#C8102E,#8B0A1F);
  display:flex;align-items:center;justify-content:center;z-index:9999;
  flex-direction:column;text-align:center;transition:opacity .5s ease}
.splash-icon{width:90px;height:90px;background:rgba(255,255,255,.18);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  animation:splashPop .6s cubic-bezier(.34,1.56,.64,1) .2s both}
.splash-brand{font-size:2.6rem;font-weight:800;color:#fff;letter-spacing:2px}
.splash-sub{font-size:.9rem;color:rgba(255,255,255,.75);letter-spacing:5px;margin-top:4px;text-transform:uppercase}
.splash-tagline{color:rgba(255,255,255,.7);font-size:.95rem;margin-top:16px}
.splash-bar{width:200px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin:24px auto 0;overflow:hidden}
.splash-bar-fill{height:100%;background:#fff;border-radius:2px;animation:splashLoad 2.6s ease forwards}
@keyframes splashPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splashLoad{from{width:0}to{width:100%}}

/* APP WRAPPER */
.app-wrapper{display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.menu-btn{width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:8px;border-radius:8px}
.menu-btn span{display:block;height:2px;background:var(--text);border-radius:2px}
.topbar-logo{flex:1;cursor:pointer}
.level-ind{background:var(--red);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px}

/* SIDEBAR */
.sidebar{position:fixed;left:-290px;top:0;bottom:0;width:290px;background:var(--surface);
  z-index:200;transition:left .3s ease;box-shadow:var(--shadow-md);overflow-y:auto}
.sidebar.open{left:0}
.sidebar-header{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:background var(--transition);font-size:.93rem}
.sidebar-nav .nav-item:hover{background:var(--bg2)}
.sidebar-nav .nav-icon{font-size:1.2rem;width:24px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.visible{opacity:1;pointer-events:all}

/* MAIN */
.main-content{flex:1;padding:16px 16px 76px;max-width:680px;margin:0 auto;width:100%}
.page{display:none}.page.active{display:block}
.page-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.page-header h2{font-size:1.5rem;font-weight:700}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);
  border-top:1px solid var(--border);display:flex;height:60px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:.6rem;color:var(--text3);transition:color var(--transition);
  min-height:48px;padding:4px 2px}
.nav-btn .nav-icon{font-size:1.3rem;line-height:1}
.nav-btn.active{color:var(--red)}

/* CARDS */
.card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3,.card h4{margin-bottom:12px}
.card-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--red);font-weight:600;margin-bottom:6px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;
  border-radius:var(--radius-sm);font-weight:600;font-size:.95rem;transition:all var(--transition);cursor:pointer;border:none;min-height:46px}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(200,16,46,.3)}
.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn-outline:hover{background:var(--red-light)}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--bg2)}
.btn-danger{background:#ff4444;color:#fff}
.btn-sm{padding:7px 14px;font-size:.82rem;min-height:36px}
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);font-size:1rem}
.btn-tts{background:var(--red-light);color:var(--red);border:none;border-radius:20px;padding:4px 12px;font-size:.78rem;cursor:pointer}
.btn-tts:hover{background:var(--red);color:#fff}
.btn-slow{background:#e8f0ff;color:#1B4FD8;border:none;border-radius:20px;padding:4px 10px;font-size:.75rem;cursor:pointer;margin-left:4px}
.btn-slow:hover{background:#1B4FD8;color:#fff}

/* TOGGLE */
.toggle{position:relative;display:inline-block;width:48px;height:26px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ccc;border-radius:26px;cursor:pointer;transition:.3s}
.slider:before{content:'';position:absolute;width:20px;height:20px;bottom:3px;left:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--red)}
input:checked+.slider:before{transform:translateX(22px)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-val{font-size:1.4rem;font-weight:700;color:var(--red)}
.stat-lbl{font-size:.7rem;color:var(--text2);margin-top:3px}

/* HOME */
.home-hero{text-align:center;padding:20px 0 16px}
.hero-logo{display:flex;justify-content:center;margin-bottom:14px}
.hero-title{font-size:1.6rem;font-weight:700}
.placement-card{text-align:center;background:linear-gradient(135deg,var(--red-light),#fff0f3);border:2px dashed var(--red)}
.placement-icon{font-size:2.5rem;margin-bottom:10px}
.quick-train-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.quick-btn{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;text-align:left;
  font-weight:600;font-size:.88rem;border:1px solid var(--border);transition:all var(--transition);min-height:48px}
.quick-btn:hover{background:var(--red-light);border-color:var(--red);color:var(--red)}
.next-lesson-card{background:linear-gradient(135deg,#f0f4ff,#fff);border-left:4px solid #1B4FD8}

/* XP / TIER */
.study-panel{padding:14px 16px}
.xp-tier-row{display:flex;align-items:center;gap:12px}
.tier-icon{font-size:1.6rem}
.tier-info{flex:1}
.tier-name{font-size:.86rem;font-weight:600;display:block;margin-bottom:5px}
.tier-bar{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}
.tier-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff6b6b);border-radius:4px;transition:width .6s}
.tier-xp{font-size:.85rem;font-weight:700;color:var(--red)}

/* DAILY CHALLENGE */
.daily-challenge{border-left:4px solid #FFD700}
.daily-challenge.done{border-left-color:#1a7a45;opacity:.85}
.challenge-header{display:flex;align-items:center;gap:12px}
.challenge-icon{font-size:1.8rem}
.challenge-title{font-weight:700;font-size:.93rem}
.challenge-desc{font-size:.8rem;color:var(--text2);margin-top:2px}
.challenge-xp{margin-left:auto;background:var(--red-light);color:var(--red);padding:4px 12px;border-radius:12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.challenge-done{text-align:center;color:#1a7a45;font-weight:600;padding:8px;background:#e8f9f0;border-radius:8px;margin-top:10px;font-size:.88rem}

/* ROADMAP */
.mini-roadmap{display:flex;flex-direction:column;gap:8px}
.mini-band{display:flex;align-items:center;gap:10px}
.mini-band-label{width:52px;font-size:.76rem;font-weight:600;text-align:right}
.mini-band-bar{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.mini-band-pct{font-size:.7rem;color:var(--text2);width:28px;text-align:right}

/* PATH */
.level-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.level-tab{padding:10px 16px;font-weight:600;font-size:.85rem;border-bottom:3px solid transparent;
  margin-bottom:-2px;white-space:nowrap;transition:all var(--transition);color:var(--text2)}
.level-tab.active{color:var(--red)}
.levels-path{display:flex;flex-direction:column;gap:10px}
.level-card{background:var(--surface);border-radius:var(--radius);border:2px solid var(--border);overflow:hidden;box-shadow:var(--shadow);transition:all var(--transition)}
.level-card.unlocked{cursor:pointer}
.level-card.locked{opacity:.45;filter:grayscale(.6)}
.level-card-header{display:flex;align-items:center;gap:14px;padding:14px 18px;transition:background var(--transition)}
.level-card.unlocked .level-card-header:hover{background:var(--bg2)}
.level-icon{font-size:1.5rem;width:36px;text-align:center}
.level-info{flex:1}
.level-info h4{margin-bottom:2px;font-size:.9rem}
.level-info small{color:var(--text2);font-size:.75rem}
.level-num{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.level-status{font-size:1rem;margin-left:6px}
.level-xp-bar{height:4px;background:var(--bg2);margin:0 18px 12px}
.band-sep{text-align:center;margin:6px 0;position:relative}
.band-sep::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}
.band-label{position:relative;background:var(--bg);padding:3px 12px;border-radius:12px;font-size:.76rem;font-weight:700;display:inline-block;border:1px solid var(--border)}

/* WORDBOOK */
.wb-search{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:1rem;margin-bottom:10px}
.wb-search:focus{outline:none;border-color:var(--red)}
.wb-filters{display:flex;gap:10px;margin-bottom:14px}
.wb-filters select{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:.86rem}
.word-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--border);box-shadow:var(--shadow)}
.word-fr{font-size:1.1rem;font-weight:700;color:var(--red);font-family:'Lora',serif}
.word-pron{font-size:.78rem;color:var(--text3)}
.word-meaning{font-weight:500;margin:4px 0;font-size:.9rem}
.word-example{font-size:.8rem;color:var(--text2);font-style:italic;margin-bottom:8px}
.word-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.word-level-badge{background:var(--red-light);color:var(--red);padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:700}
.word-state{font-size:.72rem;padding:3px 10px;border-radius:12px;font-weight:500}
.word-state.new{background:#e8f0ff;color:#1B4FD8}
.word-state.mastered{background:#e8f9f0;color:#1a7a45}
.cognate-badge{display:inline-flex;align-items:center;gap:4px;background:#fff3e0;color:#B45309;border:1px solid #FFD700;border-radius:12px;padding:3px 9px;font-size:.72rem;font-weight:600;margin-top:4px}

/* TRAINING */
.training-grid{display:flex;flex-direction:column;gap:10px}
.training-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;border:1.5px solid var(--border);box-shadow:var(--shadow);transition:all var(--transition)}
.training-card:hover{border-color:var(--red);transform:translateX(4px);background:var(--red-light)}
.training-icon{font-size:1.5rem;width:36px;text-align:center}
.training-info{flex:1}
.training-info h4{margin-bottom:2px}
.training-info small{color:var(--text2)}

/* MODALS */
.modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:none;align-items:flex-end;overflow:hidden}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-height:93vh;overflow-y:auto;animation:slideUpModal .3s ease}
.modal-box.full{border-radius:0;max-height:100vh;height:100vh}
@keyframes slideUpModal{from{transform:translateY(100%)}to{transform:none}}

/* LESSON */
.lesson-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.lesson-progress-wrap{flex:1;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--text2)}
.lesson-progress-bar{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.lesson-progress-fill{height:100%;background:var(--red);border-radius:3px;transition:width .4s}
.lesson-xp{font-size:.82rem;font-weight:700;color:var(--red)}
.lesson-body{padding:20px 16px}
.lesson-step-title{margin-bottom:14px;font-size:1.25rem}
.lesson-footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;gap:12px}
.lesson-footer .btn{flex:1}

/* MICRO STEPS */
.micro-steps{display:flex;gap:5px;padding:0 0 14px;overflow-x:auto}
.micro-step{flex-shrink:0;height:5px;border-radius:3px;background:var(--bg2);transition:background .3s;min-width:20px;flex:1}
.micro-step.done{background:var(--red)}
.micro-step.current{background:var(--red);opacity:.5}

/* STEP TYPES */
.step-intro{font-size:.95rem;line-height:1.7;color:var(--text2)}
.grammar-box{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 16px;margin-top:12px}
.grammar-box h4{margin-bottom:8px;color:var(--red)}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vocab-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border)}
.vocab-fr{font-size:1.1rem;font-weight:700;color:var(--red);font-family:'Lora',serif;margin-bottom:3px}
.vocab-pron{font-size:.77rem;color:var(--text2);margin-bottom:4px}
.vocab-meaning{font-size:.86rem;font-weight:500;margin-bottom:6px}
.dialogue-box{display:flex;flex-direction:column;gap:14px}
.dialogue-line{display:flex;flex-direction:column;gap:4px}
.dialogue-line.line-b{align-items:flex-end}
.speaker-name{font-size:.72rem;font-weight:600;color:var(--text2);padding:0 4px}
.bubble{background:var(--bg2);border-radius:16px;border-top-left-radius:4px;padding:12px 14px;max-width:88%}
.line-b .bubble{background:var(--red-light);border-radius:16px;border-top-right-radius:4px}
.bubble-fr{font-weight:500;margin-bottom:4px;line-height:1.5;font-size:.92rem}
.bubble-tr{font-size:.8rem;color:var(--text2);font-style:italic}
.grammar-card{background:var(--bg2);border-radius:var(--radius);padding:16px}
.grammar-title{font-size:.95rem;font-weight:700;color:var(--red);margin-bottom:12px;text-align:center}
.conj-table{width:100%;border-collapse:collapse}
.conj-table tr{border-bottom:1px solid var(--border)}
.conj-table tr:last-child{border-bottom:none}
.conj-fr{padding:10px 12px;font-weight:600;cursor:pointer;color:var(--red);font-family:'Lora',serif}
.conj-tr{padding:10px 12px;color:var(--text2);font-size:.86rem}
.grammar-note{background:#fffbe6;border-left:3px solid #FFD700;padding:10px 14px;border-radius:0 8px 8px 0;font-size:.86rem;margin-top:12px;color:#665500;line-height:1.5}
.grammar-note-ui{background:#f0f9ff;border-left:3px solid #1B4FD8;padding:11px 14px;border-radius:0 8px 8px 0;font-size:.86rem;line-height:1.65;margin-top:10px;color:var(--text)}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option-btn{background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;text-align:left;font-size:.88rem;font-weight:500;transition:all var(--transition);cursor:pointer;min-height:52px;line-height:1.4}
.option-btn:hover:not(:disabled){background:var(--red-light);border-color:var(--red)}
.option-btn.correct{background:#e8f9f0;border-color:#1a7a45;color:#1a7a45}
.option-btn.wrong{background:#fff0f0;border-color:#ff4444;color:#cc0000}
.ex-feedback{padding:12px 14px;border-radius:var(--radius-sm);margin-top:12px;font-size:.88rem;line-height:1.5}
.ex-feedback.hidden{display:none}
.feedback-correct{background:#e8f9f0;border:1px solid #1a7a45;color:#0d4d2a}
.feedback-wrong{background:#fff0f0;border:1px solid #ff4444;color:#8b0000}
.fill-input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:1rem}
.fill-input:focus{outline:none;border-color:var(--red)}
.fill-hint{font-size:.83rem;color:var(--text2);margin-top:8px}
.summary-box{background:linear-gradient(135deg,var(--red-light),#fff0f3);border-radius:var(--radius);padding:20px;text-align:center}
.summary-score{font-size:1.6rem;font-weight:700;color:var(--red);margin-bottom:14px}
.summary-list{text-align:left;list-style:none;display:grid;gap:8px}
.summary-list li{padding:8px 12px;background:rgba(255,255,255,.8);border-radius:8px;font-size:.88rem}

/* DRAG DROP */
.dd-answer-zone{min-height:52px;border:2px dashed var(--red);border-radius:var(--radius-sm);padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--red-light);margin-bottom:14px}
.dd-placeholder{color:var(--text3);font-size:.83rem;font-style:italic}
.dd-word-bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--bg2);border-radius:var(--radius-sm)}
.dd-word{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:9px 14px;font-size:.88rem;font-weight:500;cursor:grab;user-select:none;transition:all .2s;min-height:40px}
.dd-word:hover{border-color:var(--red);color:var(--red)}
.dd-word.placed{background:var(--red);color:#fff;border-color:var(--red);cursor:pointer}
.dd-word.used{opacity:.3;cursor:not-allowed}

/* QUIZ */
.quiz-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.quiz-progress-bar{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.quiz-body{padding:20px 16px}
.quiz-q{font-size:1.05rem;font-weight:500;margin-bottom:16px;line-height:1.5}
.quiz-result{text-align:center;padding:32px 20px}
.result-emoji{font-size:3.5rem;margin-bottom:12px}
.result-score{font-size:2.5rem;font-weight:800;color:var(--red);margin:12px 0}
.result-actions{display:flex;gap:12px;margin-top:20px;justify-content:center}

/* FLASHCARDS */
.fc-body{padding:20px 16px}
.flashcard{background:var(--bg2);border-radius:var(--radius-lg);padding:36px 20px;text-align:center;min-height:200px;cursor:pointer;border:2px solid var(--border);transition:all .3s}
.flashcard:hover{border-color:var(--red);box-shadow:var(--shadow-md)}
.fc-word{font-size:2rem;font-weight:800;color:var(--red);font-family:'Lora',serif;margin-bottom:8px}
.fc-pron{font-size:.95rem;color:var(--text2)}
.fc-meaning{font-size:1.3rem;font-weight:600;margin-bottom:10px}
.fc-example{font-size:.88rem;color:var(--text2);font-style:italic}
.fc-back{display:none}
.flashcard.flipped .fc-front{display:none}
.flashcard.flipped .fc-back{display:block}
.fc-rating{margin-top:18px;text-align:center}
.fc-rating p{font-weight:600;margin-bottom:12px;font-size:.9rem}
.fc-rating-btns{display:flex;gap:12px;justify-content:center}

/* SITUATIONS */
.situations-grid{display:flex;flex-direction:column;gap:10px}
.situation-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;border:1.5px solid var(--border);box-shadow:var(--shadow);transition:all var(--transition)}
.situation-card:hover{border-color:var(--red);transform:translateX(4px)}
.sit-icon{font-size:1.8rem;width:40px;text-align:center}
.sit-info h4{margin-bottom:4px}
.sit-info{flex:1}
.sit-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.sit-tab{flex:1;padding:10px;text-align:center;font-weight:600;font-size:.85rem;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all var(--transition);color:var(--text2);cursor:pointer}
.sit-tab.active{color:var(--red);border-bottom-color:var(--red)}
.sit-panel.hidden{display:none}
.sit-body{padding:16px}
.phrase-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.phrase-fr{font-size:1rem;font-weight:600;color:var(--red);font-family:'Lora',serif;margin-bottom:4px}
.phrase-tr{font-size:.86rem;margin-bottom:4px}
.phrase-note{font-size:.76rem;background:var(--surface);padding:3px 10px;border-radius:12px;color:var(--text2);display:inline-block;margin-bottom:6px}

/* PROGRESS */
.progress-overview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.progress-bar-track{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden;margin-bottom:6px}
.level-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.86rem}
.level-progress-row span:first-child{min-width:36px}
.level-progress-row .progress-bar-track{flex:1;height:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-item{background:var(--bg2);padding:12px 14px;border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center}
.stat-item span{color:var(--text2);font-size:.86rem}
.stat-item strong{color:var(--red);font-size:.95rem}
.achievements-grid{display:flex;flex-direction:column;gap:8px}
.achievement-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.achievement-card.earned{background:#fffbe6;border-color:#FFD700}
.achievement-card.locked{opacity:.5}
.ach-icon{font-size:1.4rem;width:30px;text-align:center}
.achievement-card strong{display:block;font-size:.86rem;margin-bottom:2px}
.achievement-card small{color:var(--text2)}
.week-calendar{display:flex;gap:6px;justify-content:space-between}
.cal-day{flex:1;text-align:center;font-size:.72rem;color:var(--text2)}
.cal-dot{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:2px solid var(--border);margin:5px auto 0}
.cal-dot.filled{background:var(--red);border-color:var(--red)}

/* SETTINGS */
.settings-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.settings-tab{padding:10px 14px;font-weight:600;font-size:.83rem;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;color:var(--text2);transition:all var(--transition);cursor:pointer}
.settings-tab.active{color:var(--red);border-bottom-color:var(--red)}
.st-panel.hidden{display:none}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--bg2);gap:16px}
.setting-row:last-child{border-bottom:none}
.setting-row label:first-child{font-size:.9rem;font-weight:500}
.setting-row select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)}
.settings-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.settings-actions .btn{width:100%;justify-content:flex-start}
.ui-lang-current{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.ui-lang-pill{background:var(--red-light);color:var(--red);padding:6px 14px;border-radius:20px;font-weight:600;font-size:.88rem}

/* ABOUT */
.how-to-steps{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.how-step{display:flex;align-items:flex-start;gap:14px}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:.83rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.how-step p{font-size:.83rem;color:var(--text2);margin:3px 0 0}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.feature-item{background:var(--bg2);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:4px}
.feature-icon{font-size:1.3rem}
.feature-item strong{font-size:.86rem}
.feature-item small{font-size:.74rem;color:var(--text2);line-height:1.4}

/* CERTIFICATES */
.cert-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.certificate-wrapper{max-width:580px;width:100%}
.certificate{background:#fff;border-radius:16px;padding:24px;position:relative;overflow:hidden;color:#1a1a2e;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.cert-header{text-align:center;margin-bottom:16px}
.cert-band-badge{display:inline-block;padding:4px 14px;border-radius:20px;color:#fff;font-size:.76rem;font-weight:700;margin-top:8px}
.cert-title-block{text-align:center;margin:16px 0}
.cert-presents{font-size:.82rem;color:#666;text-transform:uppercase;letter-spacing:1.5px}
.cert-name{font-size:1.8rem;font-weight:800;font-family:'Lora',serif;color:var(--cert-color,#C8102E);margin:8px 0 4px;line-height:1.2}
.cert-subtitle{font-size:.86rem;color:#555;margin-bottom:8px}
.cert-level-name{font-size:1.1rem;font-weight:700;margin:4px 0}
.cert-stats-row{display:flex;justify-content:center;gap:24px;padding:14px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;margin:14px 0}
.cert-stat-val{font-size:1.3rem;font-weight:800;color:var(--cert-color,#C8102E)}
.cert-stat-lbl{font-size:.7rem;color:#888;margin-top:2px}
.cert-footer{text-align:center;margin-top:14px;font-size:.76rem;color:#888}
.cert-seal{width:66px;height:66px;border-radius:50%;border:3px double;display:flex;align-items:center;justify-content:center;margin:10px auto 0}
.seal-inner{text-align:center;font-size:.55rem;font-weight:800;line-height:1.4;letter-spacing:.5px}
.cert-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:5rem;font-weight:900;opacity:.04;pointer-events:none;white-space:nowrap}
.cert-actions{display:flex;gap:12px;margin-top:14px;justify-content:center}

/* AI TUTOR */
.ai-fab{position:fixed;bottom:72px;right:16px;width:50px;height:50px;border-radius:50%;background:var(--red);color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,16,46,.4);z-index:200;cursor:pointer;border:none;transition:all var(--transition)}
.ai-fab:hover{transform:scale(1.1)}
.ai-fab-trans{bottom:132px;background:#1D4ED8}
.ai-chat-box{max-height:90vh;display:flex;flex-direction:column;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.ai-chat-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.ai-avatar{font-size:1.6rem}
.ai-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:180px;max-height:45vh}
.ai-msg.user{align-items:flex-end;display:flex;flex-direction:column}
.ai-msg.bot{align-items:flex-start;display:flex;flex-direction:column}
.ai-bubble{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.86rem;line-height:1.6}
.ai-msg.user .ai-bubble{background:var(--red);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot .ai-bubble{background:var(--bg2);border-bottom-left-radius:4px;border:1px solid var(--border)}
.ai-typing{letter-spacing:4px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.ai-suggestions{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;border-top:1px solid var(--border)}
.ai-suggestions button{flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:7px 13px;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:all var(--transition)}
.ai-suggestions button:hover{background:var(--red-light);border-color:var(--red);color:var(--red)}
.ai-input-row{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--border)}
.ai-input-row input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.9rem}
.ai-input-row input:focus{outline:none;border-color:var(--red)}

/* TRANSLATOR */
.trans-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600}
.trans-direction{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.trans-dir-btn{padding:8px 18px;border-radius:20px;border:2px solid var(--border);font-weight:600;font-size:.86rem;cursor:pointer;background:none;color:var(--text2);transition:all var(--transition)}
.trans-dir-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.trans-swap{background:none;border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.trans-body{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--border)}
.trans-panel{padding:12px 14px;position:relative}
.trans-panel:first-child{border-right:1px solid var(--border)}
.trans-panel label{display:block;font-size:.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.trans-panel textarea{width:100%;border:none;background:none;resize:none;font-size:.93rem;color:var(--text);font-family:inherit;outline:none;min-height:80px}
.trans-output{min-height:80px;font-size:.93rem;color:var(--text);line-height:1.6}
.trans-note{background:#fffbe6;padding:8px 12px;border-radius:8px;color:#665500;font-size:.82rem;border-left:3px solid #FFD700;margin:10px 14px}

/* ONBOARDING */
.onboarding-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);transition:opacity .4s}
.onboard-box{background:var(--surface);border-radius:var(--radius-lg);padding:26px 20px;max-width:460px;width:100%;max-height:94vh;overflow-y:auto;animation:slideUpModal .32s ease}
.onboard-logo{display:flex;justify-content:center;margin-bottom:16px}
.onboard-steps-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.onboard-dot{width:30px;height:5px;border-radius:3px;background:var(--border);transition:background .3s}
.onboard-dot.active{background:var(--red)}
.onboard-dot.done{background:var(--red);opacity:.45}
.onboard-title{font-size:1.2rem;font-weight:700;text-align:center;margin-bottom:6px;line-height:1.4}
.onboard-title span{font-size:.9rem;color:var(--text2);display:block;margin-top:3px}
.onboard-sub{text-align:center;color:var(--text2);font-size:.84rem;line-height:1.6;margin-bottom:14px}
.onboard-cta{width:100%;margin-top:14px}
.onboard-nav-row{display:flex;gap:12px;margin-top:14px}
.onboard-nav-row .btn{flex:1}
.onboard-search{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.9rem;margin-bottom:10px}
.onboard-search:focus{outline:none;border-color:var(--red)}
.lang-scroll-list{max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:4px}
.lang-list-btn{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--bg2);transition:background .15s;font-size:.88rem}
.lang-list-btn:last-child{border-bottom:none}
.lang-list-btn:hover{background:var(--bg2)}
.lang-list-btn.selected{background:var(--red-light);color:var(--red)}
.lang-flag-sm{font-size:1.3rem;width:26px;text-align:center;flex-shrink:0}
.lang-native{font-weight:600;flex:1}
.lang-en{font-size:.76rem;color:var(--text2)}
.lang-check{font-size:1rem;margin-left:auto}
.lang-list-btn.selected .lang-check{color:var(--red)}
.ai-pick-badge{background:linear-gradient(135deg,#1a1a2e,#2d1a4e);color:#fff;padding:5px 16px;border-radius:20px;font-size:.76rem;font-weight:600;margin:0 auto 14px;display:block;width:fit-content}
.onboard-result-box{text-align:center}
.chosen-lang-card{display:flex;align-items:center;gap:14px;background:var(--red-light);border:2px solid var(--red);border-radius:var(--radius);padding:14px 18px;margin:0 auto 12px;text-align:left;max-width:260px}
.chosen-flag{font-size:2.2rem}
.chosen-name{font-size:1.1rem;font-weight:700;color:var(--red)}
.chosen-sub{font-size:.78rem;color:var(--text2)}
.chosen-check{margin-left:auto;font-size:1.3rem;color:var(--red);font-weight:700}
.onboard-reason{font-size:.84rem;color:var(--text2);line-height:1.6;padding:10px 14px;background:var(--bg2);border-radius:8px;margin-bottom:12px}
.onboard-also{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:.78rem;color:var(--text2)}
.override-lang-wrap{margin-bottom:14px;text-align:center}
.override-lang-wrap small{display:block;margin-bottom:6px;color:var(--text2);font-size:.78rem}
.override-lang-wrap select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:.86rem;width:100%}
.onboard-level-section{text-align:left;margin-top:14px}
.onboard-level-section h3{font-size:.93rem;margin-bottom:10px;text-align:center}
.level-quick-list{display:flex;flex-direction:column;gap:7px}
.level-quick-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2);border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;text-align:left;transition:all .18s;font-size:.86rem}
.level-quick-btn:hover,.level-quick-btn.selected{border-color:var(--red);background:var(--red-light)}
.level-quick-btn.highlight{border-color:#FFD700;background:#fffbe6}
.level-quick-btn span{font-size:1.3rem;width:26px;text-align:center;flex-shrink:0}
.level-quick-btn strong{display:block;font-size:.86rem;margin-bottom:2px}
.level-quick-btn small{color:var(--text2);font-size:.74rem}

/* TOASTS */
.xp-toast{position:fixed;bottom:80px;right:16px;background:var(--red);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;z-index:1000;animation:toastAnim 2s ease forwards}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 24px;border-radius:20px;font-size:.88rem;z-index:1000;animation:toastAnim 2.8s ease forwards;white-space:nowrap}
.achievement-toast{position:fixed;bottom:80px;left:16px;right:16px;background:var(--surface);border:2px solid #FFD700;border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-md);z-index:1000;animation:toastAnim 4s ease forwards}
@keyframes toastAnim{0%{opacity:0;transform:translateY(10px) translateX(-50%)}10%{opacity:1;transform:translateY(0) translateX(-50%)}80%{opacity:1}100%{opacity:0;transform:translateY(-6px) translateX(-50%)}}

/* NEGLECT */
.neglect-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fffbe6;border:1px solid #FFD700;border-radius:var(--radius-sm);margin-bottom:14px;font-size:.86rem}
.neglect-banner strong{display:block;margin-bottom:2px}
.neglect-banner button{margin-left:auto;background:none;border:none;cursor:pointer;font-size:1rem}

/* SR REVIEW */
.sr-word{font-size:2.1rem;font-weight:800;color:var(--red);font-family:'Lora',serif;margin-bottom:8px;text-align:center}
.sr-pron{font-size:.95rem;color:var(--text2);text-align:center;margin-bottom:12px}
.sr-answer.hidden{display:none}
.sr-answer{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;margin:14px 0;text-align:left}
.sr-meaning{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.sr-example{font-size:.86rem;color:var(--text2);font-style:italic}
.sr-rating.hidden{display:none}
.sr-rating{margin-top:16px;text-align:center}
.sr-rating p{font-weight:600;margin-bottom:12px;font-size:.88rem}
.sr-rating-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sr-btn-fail{background:#fff0f0;color:#cc0000;border:2px solid #ff4444;padding:11px}
.sr-btn-hard{background:#fff9e6;color:#8B5E00;border:2px solid #FFD700;padding:11px}
.sr-btn-ok{background:#e8f0ff;color:#1B4FD8;border:2px solid #1B4FD8;padding:11px}
.sr-btn-easy{background:#e8f9f0;color:#1a7a45;border:2px solid #1a7a45;padding:11px}

/* COMPLETION */
.completion-modal{text-align:center;padding:28px 20px}
.completion-icon{font-size:3.5rem;margin-bottom:12px}
.completion-stats{display:flex;justify-content:center;gap:24px;margin:14px 0;padding:14px;background:var(--bg2);border-radius:var(--radius-sm)}
.completion-stats strong{display:block;font-size:1.3rem;color:var(--red);font-weight:800}
.completion-stats small{font-size:.72rem;color:var(--text2)}

/* RTL */
body.rtl .sidebar{left:auto;right:-290px}
body.rtl .sidebar.open{right:0;left:auto}
body.rtl .lesson-footer{flex-direction:row-reverse}
body.rtl .grammar-note-ui{border-left:none;border-right:3px solid #1B4FD8;text-align:right}

/* RESPONSIVE */
@media(min-width:480px){.vocab-grid{grid-template-columns:1fr 1fr 1fr}.options-grid{grid-template-columns:1fr 1fr}}
@media(min-width:680px){.main-content{padding:20px 24px 80px}.modal-box{max-width:600px;margin:0 auto;border-radius:var(--radius-lg)}.modal{align-items:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

      </svg>
    </div>

  </header>

  <nav class="sidebar">
    <div class="sidebar-header">
      <svg viewBox="0 0 170 36" fill="none" width="130">
        <circle cx="16" cy="18" r="13" fill="#C8102E"/>

/* ── Smart language chooser ─────────────────────────────────── */
function chooseBestExplanationLang(native, known=[]){
  const all=[native,...known].filter(Boolean);
  const romance=['es','it','pt'];
  for(const l of all) if(romance.includes(l)) return {lang:l,reason:'romance'};
  if(all.includes('en')) return {lang:'en',reason:'english'};
  const prox={es:10,it:10,pt:9,en:7,de:6,nl:5,ar:3,tr:3,ru:3,pl:3,fa:3,ur:3,zh:1,ja:1,ko:1,hi:2,id:4,ms:4,sw:2,other:3};
  let best=native||'en', bestS=prox[best]||3;
  for(const l of all){ const s=prox[l]||3; if(s>bestS){best=l;bestS=s;} }
  return {lang:best,reason:'best'};
}

/* ── TTS ─────────────────────────────────────────────────────── */
function speak(txt,lang='fr-FR'){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=lang; u.rate=parseFloat(STATE.settings?.speechRate||1);
  speechSynthesis.speak(u);
}
function speakSlow(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='fr-FR'; u.rate=0.5;
  speechSynthesis.speak(u);
}

  return t('greet_e');
}

/* ── PATH ────────────────────────────────────────────────────── */
const BANDS=['pre-a1','a1','a2','b1','b2','c1','c2'];
let activePathBand='a1';

function renderPath(){
  const el=$('path-page'); if(!el) return;
  if(!STATE.placementDone){ el.innerHTML=`<div class="card placement-card"><div class="placement-icon">🎯</div><h3>Take the Placement Test First</h3><p style="font-size:.84rem;color:var(--text2);margin:8px 0 14px">We need to know your level to show your personal path.</p><button class="btn btn-primary" style="width:100%" onclick="startPlacement()">🎯 ${t('placement')}</button></div>`; return; }

function switchBand(band){
  activePathBand=band;
  document.querySelectorAll('.level-tab').forEach((t,i)=>t.classList.toggle('active',BANDS[i]===band));
  renderBandContent(band);
}

function renderBandContent(band){
  const el=$('band-content'); if(!el) return;
  const meta=BAND_META[band];
  const levels=LEVELS.filter(l=>l.band===band);
  const curIdx=LEVELS.findIndex(l=>l.id===STATE.currentLevelId);

  el.innerHTML=`
    <div class="card" style="background:${escH(meta.bg)};border-color:${escH(meta.color)}33;margin-bottom:14px">
      <h3 style="color:${escH(meta.color)}">${escH(meta.label)}</h3>
      <p style="font-size:.84rem;color:var(--text2)">${escH(meta.desc)}</p>
    </div>
    <div class="levels-path">
      ${levels.map(lvl=>{
        const done=STATE.completedLevels?.includes(lvl.id);
        const idx=LEVELS.findIndex(l=>l.id===lvl.id);
        const unlocked=done||idx<=curIdx+1;
        return `<div class="level-card ${unlocked?'unlocked':'locked'}" onclick="${unlocked?`startLevel(${lvl.id})`:``}">
          <div class="level-card-header">
            <div class="level-icon">${escH(lvl.icon)}</div>
            <div class="level-info">
              <h4>${escH(lvl.name)}</h4>
              <small>${escH(lvl.description)}</small>
            </div>
            <div class="level-num" style="background:${escH(lvl.color)}">${escH(lvl.code)}</div>
            <span class="level-status">${done?'✅':unlocked?'▶️':'🔒'}</span>
          </div>
          ${done?`<div class="level-xp-bar"><div style="height:100%;background:${escH(lvl.color)};border-radius:2px;width:100%"></div></div>`:''}
        </div>`;
      }).join('')}
    </div>`;
}

/* ── LEVEL / LESSON ──────────────────────────────────────────── */
let currentLesson=null, lessonStep=0, lessonScore=0;

function startLevel(levelId){
  const lvl=LEVELS.find(l=>l.id===levelId); if(!lvl) return;
  const lessonId=lvl.lessons[0];
  const content=LESSON_CONTENT[lessonId];
  if(!content){ showToast('Content coming soon! 🚧'); return; }
  currentLesson={level:lvl,content};
  lessonStep=0; lessonScore=0;
  openModal('lesson-modal');
  renderLessonStep();
}

function renderLessonStep(){
  const modal=$('lesson-modal'); if(!modal) return;
  const box=modal.querySelector('.modal-box'); if(!box) return;
  const {content}=currentLesson;
  const step=content.steps[lessonStep];
  const total=content.steps.length;
  const pct=Math.round((lessonStep/total)*100);
  const isLast=lessonStep===total-1;

  box.innerHTML=`
    <div class="lesson-header">
      <button class="btn-icon" onclick="closeModal('lesson-modal')">✕</button>
      <div class="lesson-progress-wrap">
        <div class="lesson-progress-bar"><div class="lesson-progress-fill" style="width:${pct}%"></div></div>
        <span>${lessonStep+1}/${total}</span>
      </div>
      <div class="lesson-xp">⭐ ${lessonScore}</div>
    </div>
    <div class="lesson-body">
      <div class="micro-steps">
        ${Array.from({length:total},(_,i)=>`<div class="micro-step ${i<lessonStep?'done':i===lessonStep?'current':''}"></div>`).join('')}
      </div>
      <h2 class="lesson-step-title">${escH(step.title)}</h2>
      ${renderStep(step)}
    </div>
    <div class="lesson-footer">
      ${lessonStep>0?`<button class="btn btn-ghost" onclick="prevLessonStep()">${t('back')}</button>`:'<div></div>'}
      <button class="btn btn-primary" id="next-btn" onclick="nextLessonStep()">
        ${isLast?t('finish'):t('next')}
      </button>
    </div>`;
}

function renderStep(step){
  if(step.type==='intro')    return renderIntro(step);
  if(step.type==='vocab')    return renderVocab(step);
  if(step.type==='grammar')  return renderGrammar(step);
  if(step.type==='exercise') return renderExercise(step);
  if(step.type==='fill')     return renderFill(step);
  if(step.type==='dragdrop') return renderDragDrop(step);
  if(step.type==='summary')  return renderSummary(step);
  return '<p>Unknown step type</p>';
}

function renderIntro(s){
  const pct=immersionPct();
  return `<p class="step-intro">${escH(s.text)}</p>
    <div style="margin-top:14px;padding:10px 14px;background:var(--bg2);border-radius:8px;font-size:.8rem">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="color:var(--text2)">${pct<40?'Explanation in your language':'French immersion'}</span>
        <span style="color:var(--red);font-weight:700">🇫🇷 ${pct}%</span>
      </div>
      <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#1B4FD8,var(--red));border-radius:3px"></div>
      </div>
    </div>`;
}

function renderVocab(s){
  return `<div class="vocab-grid">
    ${s.words.map(w=>{
      const cog=getCognate(w.fr);
      return `<div class="vocab-card">

function checkExAnswer(chosen,correct,explanation,btn){
  if(_exAnswered) return;
  _exAnswered=true;
  const isOk=chosen===correct;
  document.querySelectorAll('.option-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===correct) b.classList.add('correct');
    if(i===chosen && !isOk) b.classList.add('wrong');
  });
  const fb=$('ex-feedback');
  if(fb){
    fb.className=`ex-feedback ${isOk?'feedback-correct':'feedback-wrong'}`;
    fb.innerHTML=`${isOk?t('correct'):t('wrong')} ${escH(explanation)}`;
    if(!isOk && currentLesson){
      fb.innerHTML+=` <button class="btn-tts" style="margin-left:8px" onclick="askAIExplanation('${escH(explanation)}')">${t('why')}</button>`;

function checkFill(){
  const inp=$('fill-answer'); if(!inp) return;
  const step=currentLesson.content.steps[lessonStep];
  const val=inp.value.trim().toLowerCase();
  const ans=step.answer.toLowerCase();
  const ok=val===ans||val.replace(/[^a-z]/g,'')===ans.replace(/[^a-z]/g,'');
  const fb=$('fill-feedback');
  if(fb){

    fb.textContent=ok?`${t('correct')} "${step.answer}" ✅`:`${t('wrong')} Answer: "${step.answer}"`;

    </div>
    <div class="ex-feedback hidden" id="dd-feedback" style="margin-top:10px"></div>

let ddPlaced=[];
function ddDragStart(e){ e.dataTransfer.setData('text',e.target.dataset.word+'|'+e.target.dataset.idx); }
function ddClick(el){
  if(el.classList.contains('placed')){
    ddPlaced=ddPlaced.filter(w=>w!==el.dataset.word);
    el.classList.remove('placed');
  } else {
    ddPlaced.push(el.dataset.word);
    el.classList.add('placed');
  }
  updateDDZone();
}
function updateDDZone(){
  const zone=$('dd-zone'); if(!zone) return;
  const ph=$('dd-placeholder');
  if(ddPlaced.length===0){ if(ph) ph.style.display=''; zone.querySelectorAll('.dd-word.placed').forEach(e=>e.remove()); return; }
  if(ph) ph.style.display='none';
  zone.querySelectorAll('.dd-word.placed').forEach(e=>e.remove());
  ddPlaced.forEach(w=>{
    const d=document.createElement('div');
    d.className='dd-word placed';
    d.textContent=w;
    d.onclick=()=>{ ddPlaced=ddPlaced.filter(x=>x!==w); d.remove(); const src=document.querySelector(`[data-word="${w}"]`); if(src) src.classList.remove('placed'); };
    zone.appendChild(d);
  });
}
function checkDD(correct){
  const ans=ddPlaced.join(' ').trim();
  const ok=ans===correct.trim();
  const fb=$('dd-feedback');
  if(fb){
    fb.className=`ex-feedback ${ok?'feedback-correct':'feedback-wrong'}`;
    fb.textContent=ok?`${t('correct')} ✅`:`${t('wrong')} Correct: "${correct}"`;
  }
  if(ok) lessonScore+=10;
}

function renderSummary(s){
  const lvl=currentLesson?.level;
  return `<div class="summary-box">

    </div>`:''}
  </div>`;
}

function nextLessonStep(){
  const steps=currentLesson?.content?.steps;
  if(!steps) return;
  if(lessonStep<steps.length-1){ lessonStep++; renderLessonStep(); }
  else finishLesson();
}
function prevLessonStep(){ if(lessonStep>0){ lessonStep--; renderLessonStep(); } }

function finishLesson(){
  const lvl=currentLesson?.level; if(!lvl) return;
  if(!STATE.completedLevels) STATE.completedLevels=[];
  if(!STATE.completedLevels.includes(lvl.id)){
    STATE.completedLevels.push(lvl.id);
    if(lvl.id>=STATE.currentLevelId) STATE.currentLevelId=Math.min(lvl.id+1,30);
    showXP(lvl.xpReward);
    updateStreak();
  }
  saveState();
  closeModal('lesson-modal');
  showCompletionModal(lvl);
}

const PLACEMENT_QS=[
  {q:'What does "Bonjour" mean?',opts:['Goodbye','Hello','Thank you','Please'],ans:1,level:'pre-a1'},
  {q:'Complete: "Je ___ français." (I am French)',opts:['suis','es','est','sommes'],ans:0,level:'a1'},
  {q:'What is the past tense of "manger" (to eat)?',opts:['Je mange','J\'ai mangé','Je mangeais','Je mangerai'],ans:1,level:'a2'},
  {q:'"Il faut que tu ___" uses which mood?',opts:['Indicatif','Subjonctif','Conditionnel','Impératif'],ans:1,level:'b1'},
  {q:'What does "nonobstant" mean?',opts:['Nevertheless','Actually','Nowadays','Similarly'],ans:0,level:'c1'},
  {q:'"Les affres" means?',opts:['The affairs','The anguish/agony','The offers','The efforts'],ans:1,level:'c2'},
  {q:'Translate: "Where is the train station?"',opts:['Où est la gare?','Qu\'est-ce que la gare?','Comment est la gare?','Quand est la gare?'],ans:0,level:'a1'},
  {q:'"Nous nous sommes retrouvés" uses which verb type?',opts:['Regular -er','Pronominal','Irregular','Modal'],ans:1,level:'b1'},
  {q:'Complete: "___ avez-vous des enfants?" (Do you have children?)',opts:['Est-ce que','Combien','Où','Comment'],ans:1,level:'a2'},
  {q:'"D\'emblée" means:',opts:['From the start','From the end','In fact','Besides'],ans:0,level:'c1'},
];

let placementStep=0, placementScores={};

function startPlacement(){
  placementStep=0; placementScores={};
  openModal('placement-modal');
  renderPlacement();
}

function renderPlacement(){
  const box=$('placement-modal')?.querySelector('.modal-box'); if(!box) return;
  if(placementStep>=PLACEMENT_QS.length){ finishPlacement(); return; }
  const q=PLACEMENT_QS[placementStep];
  const pct=Math.round((placementStep/PLACEMENT_QS.length)*100);
  box.innerHTML=`
    <div class="quiz-header">
      <button class="btn-icon" onclick="closeModal('placement-modal')">✕</button>
      <div class="quiz-progress-bar"><div style="height:100%;width:${pct}%;background:var(--red);border-radius:3px"></div></div>
      <span style="font-size:.8rem;color:var(--text2)">${placementStep+1}/${PLACEMENT_QS.length}</span>
    </div>
    <div class="quiz-body">
      <p style="font-size:.8rem;color:var(--red);font-weight:700;margin-bottom:12px">🎯 Placement Test</p>
      <p class="quiz-q">${escH(q.q)}</p>
      <div class="options-grid">
        ${q.opts.map((opt,i)=>`
          <button class="option-btn" onclick="answerPlacement(${i},${q.ans},'${q.level}',this)">
            ${escH(opt)}
          </button>`).join('')}
      </div>
    </div>`;
}

function answerPlacement(chosen,correct,level,btn){
  document.querySelectorAll('.option-btn').forEach((b,i)=>{ b.disabled=true; if(i===correct) b.classList.add('correct'); if(i===chosen&&chosen!==correct) b.classList.add('wrong'); });
  if(chosen===correct){ placementScores[level]=(placementScores[level]||0)+1; }
  setTimeout(()=>{ placementStep++; renderPlacement(); },800);
}

function finishPlacement(){
  const scores=placementScores;
  let level='pre-a1';
  if(scores['c2']>=1) level='c2';
  else if(scores['c1']>=1) level='c1';
  else if(scores['b1']>=2) level='b2';
  else if(scores['b1']>=1) level='b1';
  else if(scores['a2']>=1) level='a2';
  else if(scores['a1']>=2) level='a1';
  else if(scores['a1']>=1) level='a1';

  const lvlIdx={'pre-a1':1,'a1':6,'a2':11,'b1':16,'b2':21,'c1':26,'c2':29};
  STATE.placementDone=true;
  STATE.placementLevel=level;
  STATE.currentLevel=level;
  STATE.startLevelId=lvlIdx[level]||1;
  STATE.currentLevelId=lvlIdx[level]||1;
  saveState();

  const meta=BAND_META[level]||BAND_META['a1'];
  const box=$('placement-modal')?.querySelector('.modal-box'); if(!box) return;
  box.innerHTML=`<div class="quiz-result">
    <div class="result-emoji">🎯</div>
    <h2 style="margin-bottom:8px">Your Level</h2>
    <div class="result-score" style="color:${escH(meta.color)}">${escH(meta.label)}</div>
    <p style="color:var(--text2);margin-bottom:20px">${escH(meta.desc)}</p>
    <div style="background:${escH(meta.bg)};border:2px solid ${escH(meta.color)};border-radius:var(--radius);padding:14px;margin-bottom:16px;font-size:.86rem">
      <strong>Starting at:</strong> Level ${escH(String(lvlIdx[level]||1))} of 30
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="closeModal('placement-modal');navigate('path')">
      🗺️ See My Path →
    </button>
  </div>`;
}

function filterWordbook(q){
  const lvl=($('wb-level-filter')||{}).value||'';
  const st=($('wb-state-filter')||{}).value||'';
  let words=STATE.wordbook||[];
  if(q) words=words.filter(w=>w.fr.toLowerCase().includes(q.toLowerCase())||w.meaning.toLowerCase().includes(q.toLowerCase()));
  if(lvl) words=words.filter(w=>w.level===lvl);
  if(st) words=words.filter(w=>(w.state||'new')===st);
  const el=$('wb-list');
  if(el) el.innerHTML=words.length?renderWordList(words):'<p style="text-align:center;color:var(--text2);padding:20px">No words found.</p>';
}

function addToWordbook(fr,meaning,level){
  if(!STATE.wordbook) STATE.wordbook=[];

  saveState();
  showToast(`📖 "${fr}" added to wordbook!`);
}

}

}

/* ── QUIZ ────────────────────────────────────────────────────── */
const QUIZ_QUESTIONS=[
  {q:'Translate: "I am happy"',opts:['Je suis heureux','J\'ai heureux','Je suis heureuse','Ils sont heureux'],ans:0,exp:'Je suis (I am) + heureux (happy, masc.)'},
  {q:'Which article is feminine?',opts:['le','un','la','les'],ans:2,exp:'"la" is the feminine definite article. "le" is masculine, "les" is plural.'},
  {q:'How do you say "We eat"?',opts:['Je mange','Nous mangeons','Ils mangent','Tu manges'],ans:1,exp:'"Nous mangeons" = We eat. The -eons ending is for nous with -er verbs.'},
  {q:'"Au revoir" means:',opts:['Hello','Thank you','Goodbye','Please'],ans:2,exp:'"Au revoir" literally means "until we see again" — the standard French goodbye.'},
  {q:'Which is the past tense?',opts:['Je mange','Je mangerai','J\'ai mangé','Je mangerais'],ans:2,exp:'"J\'ai mangé" = I ate / I have eaten — passé composé.'},
  {q:'"Où" means:',opts:['When','Where','Why','How'],ans:1,exp:'"Où" = Where. Quand=When, Pourquoi=Why, Comment=How.'},
  {q:'Negate: "Je parle français"',opts:['Je no parle français','Je ne parle pas français','Je parle ne français','Je parle pas ne français'],ans:1,exp:'French negation: ne + verb + pas. Je ne parle pas = I don\'t speak.'},
  {q:'"Avoir" is used for:',opts:['To be','To want','To have','To go'],ans:2,exp:'"Avoir" = to have. Être=to be, Vouloir=to want, Aller=to go.'},
];

let quizStep=0, quizScore=0, quizAnswered=false;
function openQuiz(level){
  quizStep=0; quizScore=0;
  openModal('quiz-modal');
  renderQuizStep();
}

function renderQuizStep(){
  const box=$('quiz-modal')?.querySelector('.modal-box'); if(!box) return;
  if(quizStep>=QUIZ_QUESTIONS.length){ renderQuizResult(); return; }
  const q=QUIZ_QUESTIONS[quizStep];
  quizAnswered=false;
  const pct=Math.round((quizStep/QUIZ_QUESTIONS.length)*100);
  box.innerHTML=`
    <div class="quiz-header">
      <button class="btn-icon" onclick="closeModal('quiz-modal')">✕</button>
      <div class="quiz-progress-bar"><div style="height:100%;width:${pct}%;background:var(--red);border-radius:3px"></div></div>
      <span style="font-size:.8rem;color:var(--text2)">${quizStep+1}/${QUIZ_QUESTIONS.length}</span>
    </div>
    <div class="quiz-body">
      <p class="quiz-q">${escH(q.q)}</p>
      <div class="options-grid">
        ${q.opts.map((opt,i)=>`
          <button class="option-btn" onclick="answerQuiz(${i},${q.ans},'${escH(q.exp).replace(/'/g,"&#39;")}',this)">
            ${escH(opt)}
          </button>`).join('')}
      </div>
      <div class="ex-feedback hidden" id="quiz-feedback"></div>
    </div>`;
}

function answerQuiz(chosen,correct,explanation,btn){
  if(quizAnswered) return;
  quizAnswered=true;
  const ok=chosen===correct;
  document.querySelectorAll('.option-btn').forEach((b,i)=>{ b.disabled=true; if(i===correct) b.classList.add('correct'); if(i===chosen&&!ok) b.classList.add('wrong'); });
  const fb=$('quiz-feedback');
  if(fb){ fb.className=`ex-feedback ${ok?'feedback-correct':'feedback-wrong'}`; fb.innerHTML=`${ok?t('correct'):t('wrong')} ${escH(explanation)}`; if(!ok) fb.innerHTML+=` <button class="btn-tts" style="margin-left:8px" onclick="askAIExplanation('${escH(explanation)}')">${t('why')}</button>`; }
  if(ok) quizScore++;
  setTimeout(()=>{ quizStep++; renderQuizStep(); },1200);
}

function renderQuizResult(){
  const box=$('quiz-modal')?.querySelector('.modal-box'); if(!box) return;
  const pct=Math.round((quizScore/QUIZ_QUESTIONS.length)*100);
  const emoji=pct>=80?'🏆':pct>=60?'👍':pct>=40?'📖':'💪';
  const xp=pct>=80?30:pct>=60?20:10;
  showXP(xp);
  box.innerHTML=`<div class="quiz-result">
    <div class="result-emoji">${emoji}</div>
    <h2>Quiz Complete!</h2>
    <div class="result-score">${quizScore}/${QUIZ_QUESTIONS.length}</div>
    <p style="color:var(--text2)">${pct}% correct · +${xp} XP earned</p>
    <div class="result-actions">
      <button class="btn btn-outline" onclick="openQuiz()">🔄 Retry</button>
      <button class="btn btn-primary" onclick="closeModal('quiz-modal')">Done ✓</button>
    </div>
  </div>`;
}

    <div id="dict-feedback" style="margin-top:10px"></div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" onclick="checkDictation('${escH(s.fr)}','${escH(s.tr)}')">Check ✓</button>
      <button class="btn btn-ghost" style="flex:1" onclick="this.closest('div[style]').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>speak(s.fr),400);
}

function checkDictation(correct,translation){
  const inp=$('dict-input'); if(!inp) return;
  const val=inp.value.trim().toLowerCase().replace(/[^a-zàâäéèêëîïôùûüç\s']/g,'');
  const ans=correct.toLowerCase().replace(/[^a-zàâäéèêëîïôùûüç\s']/g,'');
  const ok=val===ans||val.replace(/\s/g,'')===ans.replace(/\s/g,'');
  const fb=$('dict-feedback');
  if(fb){ fb.className=`ex-feedback ${ok?'feedback-correct':'feedback-wrong'}`; fb.innerHTML=ok?`✅ ${t('correct')}<br><small>${escH(translation)}</small>`:`❌ ${t('wrong')}<br><strong>${escH(correct)}</strong><br><small>${escH(translation)}</small>`; }
  if(ok) showXP(15);
}

/* ── SPEAKING ────────────────────────────────────────────────── */
function startSpeaking(){
  const phrases=['Bonjour','Merci beaucoup','Au revoir','Bonsoir','S\'il vous plaît'];
  const ph=phrases[Math.floor(Math.random()*phrases.length)];
  showToast(`🎤 Say: "${ph}" — listen first`);
  setTimeout(()=>speak(ph),500);
}

/* ── AI TUTOR ────────────────────────────────────────────────── */
let aiHistory=[];
function openAIChat(){
  const modal=$('quiz-modal'); if(!modal) return;
  const box=modal.querySelector('.modal-box');
  aiHistory=[];
  box.innerHTML=`
    <div class="ai-chat-box">
      <div class="ai-chat-header">
        <div class="ai-avatar">🤖</div>
        <div style="flex:1"><strong>AI French Tutor</strong><div style="font-size:.75rem;color:var(--text2)">Ask me anything about French</div></div>
        <button class="btn-icon" onclick="closeModal('quiz-modal')">✕</button>
      </div>
      <div class="ai-messages" id="ai-messages">
        <div class="ai-msg bot"><div class="ai-bubble">Bonjour! 👋 I'm your AI French tutor. Ask me anything — grammar, vocabulary, pronunciation, or how French compares to your language!</div></div>
      </div>
      <div class="ai-suggestions">
        <button onclick="sendAI('Why do French nouns have gender?')">Why do French nouns have gender?</button>
        <button onclick="sendAI('Explain the difference between être and avoir')">être vs avoir?</button>
        <button onclick="sendAI('How do I form the past tense?')">Past tense?</button>
        <button onclick="sendAI('What are the most useful French phrases?')">Useful phrases?</button>
      </div>
      <div class="ai-input-row">
        <input type="text" id="ai-inp" placeholder="Ask about French..." onkeydown="if(event.key==='Enter')sendAI()"/>
        <button class="btn btn-primary btn-sm" onclick="sendAI()">Send</button>
      </div>
    </div>`;
  openModal('quiz-modal');
}

async function sendAI(text){
  const inp=$('ai-inp');
  const msg=(text||inp?.value||'').trim();
  if(!msg) return;
  if(inp) inp.value='';
  const msgs=$('ai-messages'); if(!msgs) return;
  msgs.innerHTML+=`<div class="ai-msg user"><div class="ai-bubble">${escH(msg)}</div></div>`;
  msgs.innerHTML+=`<div class="ai-msg bot" id="ai-typing"><div class="ai-bubble"><span class="ai-typing">···</span></div></div>`;
  msgs.scrollTop=msgs.scrollHeight;
  aiHistory.push({role:'user',content:msg});
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,system:`You are a French language tutor for Languway French. The student's preferred language is ${STATE.uiLang||'en'}. Explain French grammar and vocabulary clearly, comparing to the student's language when helpful. Be encouraging and concise. Use examples. If the student makes a French mistake, gently correct it.`,messages:aiHistory})});
    const data=await resp.json();
    const reply=data.content?.[0]?.text||'Sorry, I had trouble connecting. Please try again.';
    aiHistory.push({role:'assistant',content:reply});
    document.getElementById('ai-typing')?.remove();
    if(msgs) msgs.innerHTML+=`<div class="ai-msg bot"><div class="ai-bubble">${escH(reply)}</div></div>`;
    if(msgs) msgs.scrollTop=msgs.scrollHeight;
  } catch(e){
    document.getElementById('ai-typing')?.remove();
    if(msgs) msgs.innerHTML+=`<div class="ai-msg bot"><div class="ai-bubble">Connection error. Check your internet and try again. 🔌</div></div>`;
  }
}

function askAIExplanation(exp){ openAIChat(); setTimeout(()=>sendAI(`Can you explain this mistake more clearly? The feedback was: "${exp}"`),600); }

/* ── TRANSLATOR ──────────────────────────────────────────────── */
let transDir='fr-en';
function openTranslator(){
  const modal=$('sit-modal'); if(!modal) return;
  modal.querySelector('.modal-box').innerHTML=`
    <div class="trans-header">
      <span style="flex:1">🔤 Translator</span>
      <button class="btn-icon" onclick="closeModal('sit-modal')">✕</button>
    </div>
    <div class="trans-direction">
      <button class="trans-dir-btn ${transDir==='fr-en'?'active':''}" onclick="setTransDir('fr-en')">🇫🇷 FR</button>
      <button class="trans-swap" onclick="swapTrans()">⇄</button>
      <button class="trans-dir-btn ${transDir==='en-fr'?'active':''}" onclick="setTransDir('en-fr')">🌐 ${(STATE.uiLang||'EN').toUpperCase()}</button>
    </div>
    <div class="trans-body">
      <div class="trans-panel">
        <label>${transDir==='fr-en'?'🇫🇷 French':'🌐 Your language'}</label>
        <textarea id="trans-input" placeholder="Type here..." oninput="debounceTranslate()"></textarea>
      </div>
      <div class="trans-panel">
        <label>${transDir==='fr-en'?'🌐 Translation':'🇫🇷 French'}</label>
        <div class="trans-output" id="trans-output"><span style="color:var(--text3)">Translation will appear here</span></div>
      </div>
    </div>
    <div style="padding:10px 14px;display:flex;gap:8px">
      <button class="btn-tts" onclick="speakTransInput()">🔊 Listen</button>
      <button class="btn-slow" onclick="speakTransSlow()">🐢 Slow</button>
    </div>
    <div id="trans-note"></div>`;
  openModal('sit-modal');
}

let transTimer;
function debounceTranslate(){ clearTimeout(transTimer); transTimer=setTimeout(doTranslate,600); }
function setTransDir(d){ transDir=d; openTranslator(); }
function swapTrans(){ transDir=transDir==='fr-en'?'en-fr':'fr-en'; openTranslator(); }

async function doTranslate(){
  const inp=$('trans-input'); const out=$('trans-output'); if(!inp||!out) return;
  const text=inp.value.trim(); if(!text){ out.textContent=''; return; }
  out.innerHTML='<span style="color:var(--text3)">Translating...</span>';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:300,messages:[{role:'user',content:`Translate this ${transDir==='fr-en'?'French text to English and also to the student\'s language (${STATE.uiLang||"English"})':'text to French'}]. Be concise, just give the translation. Text: "${text}"`}]})});
    const data=await resp.json();
    out.textContent=data.content?.[0]?.text||'Translation unavailable';
  } catch(e){ out.textContent='Translation error. Check connection.'; }
}
function speakTransInput(){ const v=($('trans-input')||{}).value; if(v) speak(v,transDir==='fr-en'?'fr-FR':'en-US'); }
function speakTransSlow(){ const v=($('trans-input')||{}).value; if(v) speakSlow(v); }

/* ── MODAL HELPERS ───────────────────────────────────────────── */
function openModal(id){ const m=$(id); if(m){ m.classList.add('open'); document.body.style.overflow='hidden'; } }
function closeModal(id){ const m=$(id); if(m){ m.classList.remove('open'); document.body.style.overflow=''; } }

/* ── STREAK ──────────────────────────────────────────────────── */
function updateStreak(){
  const today=new Date().toDateString();
  const last=STATE.lastStudyDate;
  if(last===today) return;
  const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
  STATE.streak=(last===yesterday.toDateString())?(STATE.streak||0)+1:1;
  STATE.lastStudyDate=today;
}

/* ── ONBOARDING ──────────────────────────────────────────────── */
function needsOnboarding(){ return !STATE.onboardingDone||!STATE.uiLang; }

function startOnboarding(){
  let ov=document.getElementById('onboarding-overlay');
  if(!ov){ ov=document.createElement('div'); ov.id='onboarding-overlay'; ov.className='onboarding-overlay'; document.body.appendChild(ov); }
  showOnboardStep1(ov);
}

function showOnboardStep1(ov){
  ov.innerHTML=`<div class="onboard-box">
    <div class="onboard-logo">
      <svg viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="170">
        <circle cx="22" cy="24" r="18" fill="#C8102E"/>
        <path d="M14 24 L22 10 L30 24" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        <circle cx="30" cy="24" r="9" fill="none" stroke="white" stroke-width="2.5"/>
        <text x="46" y="30" font-family="Sora,sans-serif" font-weight="800" font-size="18" fill="currentColor">Languway</text>
        <text x="46" y="43" font-family="Sora,sans-serif" font-weight="400" font-size="10" fill="#C8102E" letter-spacing="3">FRENCH</text>
      </svg>
    </div>
    <div class="onboard-steps-row"><div class="onboard-dot active"></div><div class="onboard-dot"></div><div class="onboard-dot"></div></div>
    <h2 class="onboard-title">What is your native language?<br/><span>ما هي لغتك الأم؟</span></h2>
    <p class="onboard-sub">We'll use this to explain French in a way that makes sense to you.</p>
    <input class="onboard-search" type="text" placeholder="Search language / البحث..." oninput="filterLangList('ob-native',this.value)" autocomplete="off"/>
    <div class="lang-scroll-list" id="ob-native">
      ${SUPPORTED_UI_LANGS.map(l=>`<button class="lang-list-btn" data-code="${escH(l.code)}" onclick="selectNative('${escH(l.code)}',this)"><span class="lang-flag-sm">${l.flag}</span><span class="lang-native">${escH(l.native)}</span><span class="lang-en">${escH(l.name)}</span></button>`).join('')}
    </div>
    <button class="btn btn-primary onboard-cta" id="ob-btn1" disabled onclick="showOnboardStep2(document.getElementById('onboarding-overlay'))">Continue →</button>
  </div>`;
}

function filterLangList(listId,q){
  const el=$(listId); if(!el) return;
  el.querySelectorAll('.lang-list-btn').forEach(b=>{ b.style.display=b.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'; });
}

function selectNative(code,btn){
  document.querySelectorAll('#ob-native .lang-list-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  STATE._nativeLang=code;
  const ob=$('ob-btn1'); if(ob) ob.disabled=false;
}

function showOnboardStep2(ov){
  ov.innerHTML=`<div class="onboard-box">
    <div class="onboard-steps-row"><div class="onboard-dot done"></div><div class="onboard-dot active"></div><div class="onboard-dot"></div></div>
    <h2 class="onboard-title">Other languages you know?</h2>
    <p class="onboard-sub">Select all languages you can read or understand.<br/><small style="color:var(--text3)">This helps us choose the best way to explain French to you.</small></p>
    <input class="onboard-search" type="text" placeholder="Search..." oninput="filterLangList('ob-known',this.value)" autocomplete="off"/>
    <div class="lang-scroll-list" id="ob-known">
      ${SUPPORTED_UI_LANGS.filter(l=>l.code!==STATE._nativeLang&&l.code!=='other').map(l=>`<button class="lang-list-btn" data-code="${escH(l.code)}" onclick="toggleKnown('${escH(l.code)}',this)"><span class="lang-flag-sm">${l.flag}</span><span class="lang-native">${escH(l.native)}</span><span class="lang-en">${escH(l.name)}</span><span class="lang-check">☐</span></button>`).join('')}
    </div>
    <div class="onboard-nav-row">
      <button class="btn btn-ghost" onclick="showOnboardStep1(document.getElementById('onboarding-overlay'))">← Back</button>
      <button class="btn btn-primary" onclick="showOnboardStep3(document.getElementById('onboarding-overlay'))">Continue →</button>
    </div>
  </div>`;
  if(!STATE._knownLangs) STATE._knownLangs=[];
}

function toggleKnown(code,btn){
  if(!STATE._knownLangs) STATE._knownLangs=[];
  const has=STATE._knownLangs.includes(code);
  if(has){ STATE._knownLangs=STATE._knownLangs.filter(c=>c!==code); btn.classList.remove('selected'); btn.querySelector('.lang-check').textContent='☐'; }
  else { STATE._knownLangs.push(code); btn.classList.add('selected'); btn.querySelector('.lang-check').textContent='☑'; }
}

function showOnboardStep3(ov){
  const result=chooseBestExplanationLang(STATE._nativeLang,STATE._knownLangs||[]);
  const chosen=SUPPORTED_UI_LANGS.find(l=>l.code===result.lang)||SUPPORTED_UI_LANGS[0];
  const native=SUPPORTED_UI_LANGS.find(l=>l.code===STATE._nativeLang);
  const reasonMsg={
    romance:`Because you know a Romance language, which is very close to French — this will accelerate your learning!`,
    english:`English has the richest French learning resources and comparisons.`,
    best:`This is the language most similar to French from what you know.`,
  }[result.reason]||'';

  STATE._chosenUILang=result.lang;

  ov.innerHTML=`<div class="onboard-box onboard-result-box">
    <div class="onboard-steps-row"><div class="onboard-dot done"></div><div class="onboard-dot done"></div><div class="onboard-dot active"></div></div>
    <div class="ai-pick-badge">🤖 AI Language Selection</div>
    <div class="chosen-lang-card"><div class="chosen-flag">${chosen.flag}</div><div class="chosen-info"><div class="chosen-name">${escH(chosen.native)}</div><div class="chosen-sub">${escH(chosen.name)}</div></div><div class="chosen-check">✓</div></div>
    <p class="onboard-reason">${escH(reasonMsg)}</p>
    <div class="onboard-also">
      <small>Your native language: <strong>${escH(native?.native||STATE._nativeLang||'')}</strong></small>
      ${(STATE._knownLangs||[]).length?`<small>You also know: ${(STATE._knownLangs||[]).map(c=>SUPPORTED_UI_LANGS.find(l=>l.code===c)?.native||c).join(', ')}</small>`:''}
    </div>
    <div class="override-lang-wrap">
      <small>Prefer a different explanation language?</small>
      <select onchange="STATE._chosenUILang=this.value||'${result.lang}'">
        <option value="">— Keep AI suggestion (${escH(chosen.native)}) —</option>
        ${SUPPORTED_UI_LANGS.filter(l=>l.code!=='other').map(l=>`<option value="${escH(l.code)}" ${l.code===result.lang?'selected':''}>${l.flag} ${escH(l.native)}</option>`).join('')}
      </select>
    </div>
    <div class="onboard-level-section">
      <h3>What is your French level?</h3>
      <div class="level-quick-list">
        ${[['zero','🌱','Complete beginner','I know nothing about French',false],
           ['basic','📗','Know some words','Bonjour, merci, au revoir...',false],
           ['mid','📘','Basic conversations','Simple sentences & phrases',false],
           ['advanced','📙','Intermediate+','I can hold real conversations',false],
           ['test','🎯','Take a placement test','30 questions — most precise',true]
        ].map(([id,ic,title,desc,hl])=>`
          <button class="level-quick-btn ${hl?'highlight':''}" onclick="selectQuickLevel('${id}',this)">
            <span>${ic}</span>
            <div><strong>${escH(title)}</strong><small>${escH(desc)}</small></div>
          </button>`).join('')}
      </div>
    </div>
    <div class="onboard-nav-row">
      <button class="btn btn-ghost" onclick="showOnboardStep2(document.getElementById('onboarding-overlay'))">← Back</button>
      <button class="btn btn-primary" id="ob-btn3" onclick="finishOnboarding()" disabled>🚀 Start Learning →</button>
    </div>
  </div>`;
}

let _doPlacement=false;
function selectQuickLevel(level,btn){
  document.querySelectorAll('.level-quick-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  _doPlacement=level==='test';
  const map={zero:'pre-a1',basic:'a1',mid:'a2',advanced:'b1',test:'a1'};
  STATE._chosenStartLevel=map[level]||'a1';
  const b=$('ob-btn3'); if(b) b.disabled=false;
}

function finishOnboarding(){
  STATE.uiLang=STATE._chosenUILang||STATE._nativeLang||'en';
  STATE.nativeLang=STATE._nativeLang||'en';
  STATE.knownLangs=STATE._knownLangs||[];
  STATE.onboardingDone=true;
  if(!_doPlacement){
    STATE.currentLevel=STATE._chosenStartLevel||'a1';
    STATE.placementDone=true;
    const idx={'pre-a1':1,'a1':6,'a2':11,'b1':16,'b2':21};
    STATE.startLevelId=idx[STATE.currentLevel]||1;
    STATE.currentLevelId=STATE.startLevelId;
  }
  if(isRTL(STATE.uiLang)){ document.body.setAttribute('dir','rtl'); document.body.classList.add('rtl'); }
  else{ document.body.removeAttribute('dir'); document.body.classList.remove('rtl'); }
  saveState();
  updateLevelIndicator();
  const ov=document.getElementById('onboarding-overlay');
  if(ov){ ov.style.opacity='0'; setTimeout(()=>ov.remove(),400); }
  if(_doPlacement) setTimeout(()=>startPlacement(),500);
  else navigate('home');
}

function changeUILanguage(){ STATE.onboardingDone=false; startOnboarding(); }

/* ── BOTTOM NAV LISTENERS ────────────────────────────────────── */
document.querySelectorAll('.nav-btn[data-page]').forEach(btn=>{
  btn.addEventListener('click',()=>navigate(btn.dataset.page));
});

/* ── INIT ────────────────────────────────────────────────────── */
function init(){
  loadState();
  if(STATE.settings?.darkMode) document.body.classList.add('dark');
  if(STATE.settings?.fontSize) document.documentElement.style.fontSize=STATE.settings.fontSize+'px';
  if(isRTL(STATE.uiLang)){ document.body.setAttribute('dir','rtl'); document.body.classList.add('rtl'); }
  updateLevelIndicator();

  // Splash
  setTimeout(()=>{
    const splash=$('splash');
    if(splash){ splash.style.opacity='0'; setTimeout(()=>{ splash.style.display='none'; $('app').style.display='flex'; $('fab-ai').style.display='flex'; $('fab-tr').style.display='flex'; if(needsOnboarding()) setTimeout(startOnboarding,300); else { renderHome(); navigate('home'); } },500); }
  },2800);
}

document.addEventListener('DOMContentLoaded',init);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveState(); });
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
